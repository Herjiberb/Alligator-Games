function render(){const f=P[S.page]||P.home;$('#page').innerHTML=f();$$('.nav').forEach(n=>n.classList.toggle('on',n.dataset.p==S.page));if(S.page=='home'){buildLogoFor()}if(S.page=='skins')wireSkins();if(S.page=='settings')storEst();{const sk=skinSrc(S.set.skin);$('#uchip').innerHTML=`<div class="frame">${sk?`<img src="${esc(sk)}" onerror="this.style.opacity=.2">`:''}</div><div><b>${esc(skinName(S.set.skin))}</b><small>${esc(curInst().name)}</small></div>`}$('#instSel').innerHTML=S.insts.map(i=>`<option value="${i.id}" ${i.id==S.set.curInst?'selected':''}>${esc(i.icon||'📦')} ${esc(i.name)}</option>`).join('')}
function buildLogoFor(){const c=$('#logo');if(!logoW)buildLogo();renderWorld(c,logoW,16,true)}
function go(p){S.page=p;render();$('#main').scrollTop=0}
function wireSkins(){const q=$('#skq');q&&(q.oninput=()=>{const v=q.value.toLowerCase();$$('.sk').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')});const f=$('#skf'),d=$('#skd');f.onchange=()=>{addSkins([...f.files]);f.value=''};d.onclick=()=>f.click();d.ondragover=e=>{e.preventDefault();d.classList.add('hv')};d.ondragleave=()=>d.classList.remove('hv');d.ondrop=e=>{e.preventDefault();d.classList.remove('hv');addSkins([...e.dataTransfer.files])}}
async function addSkins(files){for(const f of files){if(!f.type.startsWith('image/'))continue;const url=URL.createObjectURL(f),im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url});if(!im){toast('Could not read '+f.name);continue}
let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let g=c.getContext('2d');g.drawImage(im,0,0);const ok=Math.abs(im.width/im.height-1/3)<.02;
if(!ok){const r=await modal('Not 1:3',`<p><b>${esc(f.name)}</b> is ${im.width}×${im.height}. Skins must be 1:3 (width:height).</p><p class="sub">Auto-fit stretches it to fill the whole 1:3 canvas (no blank space). Skins are always saved fully opaque.</p>`,[['Skip',''],['Auto-fit','pri']]);if(r.i!=1)continue;const w=Math.max(im.width,Math.ceil(im.height/3)),h=w*3;c=document.createElement('canvas');c.width=w;c.height=h;g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(im,0,0,w,h)}
{const id=g.getImageData(0,0,c.width,c.height),d=id.data;let r=0,gg=0,b=0,n=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>=128){r+=d[i];gg+=d[i+1];b+=d[i+2];n++}const A=n?[r/n,gg/n,b/n].map(Math.round):[128,128,128];for(let i=0;i<d.length;i+=4){if(d[i+3]<128){d[i]=A[0];d[i+1]=A[1];d[i+2]=A[2]}d[i+3]=255}g.putImageData(id,0,0)}
const k={id:uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,28),data:c.toDataURL('image/png'),w:c.width,h:c.height,added:Date.now()};await put('skins',k);S.skins.push(k);S.set.skin={t:'upload',id:k.id};await kvSet('set',S.set);log('info','skins','Uploaded skin '+k.name);toast('Skin added & selected')}render()}

const path=inst.path||S.set.path;gf.src=encodeURI(path)+'?launcher=1&inst='+encodeURIComponent(inst.id)+'&_='+Date.now();log('info','launcher','Launch '+inst.name+' ('+path+')');
G.to=setTimeout(()=>{if(!G.ready){$('#spT').textContent='Taking a while…';$('#spS').textContent='Check the game path in Settings, and that the game file sits beside the launcher.'}},12000)}

if(m.t=='ready'){G.ready=1;G.t0=Date.now();clearTimeout(G.to);const inst=G.inst,s=skinSrc(inst.skin||S.set.skin);G.status=Object.assign({links:0,peers:0},m);
send('init',{relay:S.set.relay||'',roomCode:G.o.hostCode||S.set.roomcode||'',name:S.set.pname||'',ice:!!S.set.stun,skin:s?{src:s}:null,world:G.w?G.w.buf:null,worldId:G.w&&G.w.id,worldName:G.w?G.w.name:G.o.name,seed:G.o.seed!=null?G.o.seed:null,injects:[{name:'Night brightness',code:'window.NIGHT_MIN='+nmVal()}].concat(inst.noInj?[]:S.injects.filter(j=>j.on).map(j=>({name:j.name,code:j.code})))});
setTimeout(()=>$('#splash').classList.add('out'),350);toast('Welcome to '+inst.name);if(G.o.mp)setTimeout(()=>{openHub(G.o.mp);if(G.o.joinCode)setTimeout(()=>{const i=$('#hubInv');if(i){i.value=G.o.joinCode;rememberRoom(G.o.joinCode,'join');send('mp',{a:'join',code:G.o.joinCode})}},300)},800)}
else if(m.t=='list'||m.t=='listWorlds')send('worlds',{list:wlist()});
else if(m.t=='saveWorld'){const old=!m.fork&&m.id&&S.worlds.find(w=>w.id==m.id);let w;if(old){if(!m.auto)old.prev={buf:old.buf,bytes:old.bytes,updated:old.updated};w=Object.assign(old,{name:m.name,seed:m.seed,mode:m.mode,bytes:m.bytes,buf:m.buf,updated:Date.now(),px:m.px,py:m.py,online:m.online||null});if(m.shot)w.shot=m.shot}else{w={id:uid(),name:m.name,seed:m.seed,mode:m.mode,bytes:m.bytes,buf:m.buf,shot:m.shot,created:Date.now(),updated:Date.now(),parent:m.id||null,px:m.px,py:m.py,online:m.online||null};S.worlds.push(w)}
await put('worlds',w);G.w=w;log('world','world',(m.online=='host'?'[hosted online] ':m.online=='guest'?'[online copy] ':'')+(old?'Overwrote ':m.id?'Forked ':'Saved ')+'“'+w.name+'” ('+fmtB(w.bytes)+(w.shot?', screenshot':', no screenshot')+')');if(!m.auto)toast('💾 '+(old?'Overwrote ':'Saved ')+w.name+(w.online=='host'?' (hosted online)':w.online=='guest'?' (online copy)':''));send('worlds',{list:wlist(),cur:w.id})}
else if(m.t=='log')log(m.lvl,'game',m.msg);
