const card=g=>`<a href="#/g/${h(g.id)}" class="card pn block overflow-hidden"><div class="aspect-video overflow-hidden">${thumb(g)}</div><div class="p-3"><div class="font-semibold truncate">${h(g.title)}</div><div class="text-xs" style="color:var(--mu)">${h(g.cat||'Casual')}</div></div></a>`;
const NAV=[['#/','Home','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['#/fav','Favorites','<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>'],['#/edit','Editor','<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>']];
const hdr=r=>`<header class="sticky top-0 z-30" style="background:#0f1412cc;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)"><div class="max-w-6xl mx-auto px-5 py-3 flex items-center gap-3"><span style="width:28px;height:28px">${LOGO}</span><div class="dp text-xl font-extrabold gt">Alligator Games</div><div class="flex-1"></div><nav class="hidden md:flex gap-2">${NAV.map(([k,l])=>`<a href="${k}" class="btn ${r==k?'ac':''}">${l}</a>`).join('')}</nav></div></header>`;
const bn=r=>`<nav class="bn pn">${NAV.map(([k,l,d])=>`<a href="${k}" class="${r==k?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>${l}</a>`).join('')}</nav>`;
let Q='',C='';
function home(r){
 const fav=r=='#/fav',all=gs(),f=fv(),top=all[0];
 app.innerHTML=hdr(r)+`<main class="fade max-w-6xl mx-auto px-5 pt-4 pb-32">`+
 (!fav&&top?`<a id="hero" href="#/g/${h(top.id)}" class="pn block relative overflow-hidden mb-5" style="height:320px"><div class="hs absolute inset-0"><div class="absolute inset-0">${thumb(top)}</div><div class="absolute inset-0" style="background:linear-gradient(0deg,#0f1412,#0f141255 60%,transparent)"></div><div class="absolute bottom-0 left-0 right-0 p-8"><div class="text-xs mb-1" style="color:var(--ac)">LATEST</div><h1 class="dp text-4xl font-extrabold">${h(top.title)}</h1><p class="mt-1 line-clamp-2" style="color:var(--mu)">${h(top.desc)}</p><span class="btn ac mt-3">▶ Play</span></div></div></a>`:'')+
 `<h1 class="dp text-2xl font-extrabold mb-3">${fav?'Favorites':'All games'}</h1><input id="q" type="search" placeholder="Search games…" value="${h(Q)}" class="w-full mb-3 px-4 py-2 rounded-xl" style="background:var(--pn);border:1px solid var(--ln);color:var(--tx)"><div id="ch" class="flex flex-wrap gap-2 mb-4">${['',...CATS].map(c=>`<span class="chip ${C==c?'on':''}" data-c="${h(c)}">${c||'All'}</span>`).join('')}</div><div id="grid"></div></main>`+bn(r);
 const draw=()=>{const l=all.filter(g=>(!fav||f.includes(g.id))&&(!C||g.cat==C)&&(!Q||g.title.toLowerCase().includes(Q.toLowerCase())));
  $('#grid').className=l.length?'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4':'';
  $('#grid').innerHTML=l.length?l.map(card).join(''):`<div class="pn p-8 text-center" style="color:var(--mu)">${all.length?'No games match.':'No games yet. Open the Editor to add one.'}</div>`};
 draw();$('#q').oninput=e=>{Q=e.target.value;draw()};
 $$('#ch .chip').forEach(c=>c.onclick=()=>{C=c.dataset.c;$$('#ch .chip').forEach(x=>x.classList.toggle('on',x==c));draw()});
}
const SPD=[1,1.5,2,.5];let SI=0;
function play(id){
 const g=gs().find(x=>x.id==id);if(!g){location.hash='#/';return}
 const heart=()=>fv().includes(id)?'♥':'♡';
 app.innerHTML=`<div id="stage" style="position:fixed;inset:0;background:#000"><iframe id="gf" title="${h(g.title)}" allow="autoplay;fullscreen;gamepad;clipboard-write" style="width:100%;height:100%;border:0"></iframe></div>
 <div id="bar" class="pn" style="position:fixed;z-index:50;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;align-items:center;gap:6px;padding:6px"><div class="bt" style="display:flex;gap:6px;align-items:center"><button data-a="back" title="Back">‹</button><button data-a="mute" title="Mute">🔊</button><button data-a="pause" title="Pause">⏸</button><button data-a="spd" class="c2 chip">×1</button><button data-a="heart" class="heart" title="Favorite">${heart()}</button><button data-a="fs" title="Fullscreen">⛶</button></div><button data-a="min" title="Hide controls">•••</button></div>`;
 if(!('serviceWorker'in navigator)){toast('Service workers are required to run games');return}
 navigator.serviceWorker.ready.then(()=>{const f=$('#gf');if(!f)return;f.onload=()=>{focusGame(1);favSync()};f.src=gurl(id,g.entry||'index.html')});
}
app.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,ag=()=>{try{return $('#gf').contentWindow.__ag}catch{}};
 if(a=='back')return history.length>1?history.back():location.hash='#/';
 if(a=='min')return $('#bar').classList.toggle('min');
 if(a=='mute'){const x=ag();if(!x)return;x.setMute(!x.mute);localStorage.agmute=x.mute?'1':'0';b.textContent=x.mute?'🔇':'🔊'}
 if(a=='pause'){const x=ag();if(!x)return;x.setPause(!x.paused);b.textContent=x.paused?'▶':'⏸'}
 if(a=='spd'){const x=ag();if(!x)return;SI=(SI+1)%SPD.length;x.setSpeed(SPD[SI]);b.textContent='×'+SPD[SI]}
 if(a=='heart'){const id=location.hash.split('/')[2],f=fv(),i=f.indexOf(id);i<0?f.push(id):f.splice(i,1);localStorage.ag_fav=JSON.stringify(f);b.textContent=i<0?'♥':'♡';b.classList.toggle('on',i<0)}
 if(a=='fs'){document.fullscreenElement?document.exitFullscreen():$('#stage').requestFullscreen?.().catch(()=>{});setTimeout(()=>focusGame(1),200)}
 // editor
 if(a=='pw')return pwGo();
 if(a=='sec'){ES.s=b.dataset.s;if(ES.s=='form'&&!b.dataset.keep)ES.e=null;return edit()}
 if(a=='new'){ES.s='form';ES.e=null;return edit()}
 if(a=='ed'){ES.s='form';ES.e=b.dataset.id;return edit()}
 if(a=='del'){if(!confirm('Delete this game and its files?'))return;const id=b.dataset.id;ss(gs().filter(g=>g.id!=id));await caches.delete('g-'+id);for(const k of Object.keys(localStorage))if(k.startsWith('g:'+id+':'))localStorage.removeItem(k);toast('Deleted');return edit()}
 if(a=='save')return save();
});
const ES={s:'list',e:null};
const pwGo=()=>{if($('#pw').value==PW){EDOK=true;edit()}else toast('Wrong password')};
function edit(){
 if(!EDOK){app.innerHTML=hdr('#/edit')+`<main class="fade max-w-sm mx-auto px-5 pt-16 pb-32"><div class="pn p-6"><h1 class="dp text-2xl font-extrabold mb-1">Editor</h1><p class="mb-4" style="color:var(--mu)">Enter the password to continue.</p><input id="pw" type="password" autocomplete="current-password" class="w-full px-4 py-2 rounded-xl mb-3" style="background:var(--p2);border:1px solid var(--ln);color:var(--tx);font-size:16px"><button data-a="pw" class="btn ac w-full">Unlock</button></div></main>`+bn('#/edit');$('#pw').onkeydown=e=>e.key=='Enter'&&pwGo();return}
 const sec=(s,l)=>`<a data-a="sec" data-s="${s}" data-keep="${ES.e?1:''}" class="${ES.s==s?'on':''}">${l}</a>`;
 app.innerHTML=`<div class="gh"><header class="edh sticky top-0 z-20 flex items-center gap-2 px-4 py-2" style="background:#161b22;border-bottom:1px solid #30363d"><a class="gb" href="#/">‹ Back</a><div class="tt font-semibold">Game editor</div><div class="flex-1"></div><button class="gb p" data-a="new">+ New game</button></header><div class="edw flex gap-6 max-w-5xl mx-auto p-4"><nav class="sb w-52 shrink-0" style="position:sticky;top:70px;align-self:flex-start"><h4>Library</h4>${sec('list','Games')}${sec('form',ES.e?'Edit game':'Add game')}</nav><main class="flex-1 fade" id="em"></main></div></div>`+bn('#/edit');
 const em=$('#em');
 if(ES.s=='list'){const l=gs();em.innerHTML=`<h2>Games (${l.length})</h2>`+(l.map(g=>`<div class="rowg flex items-center gap-3 py-3" style="border-bottom:1px solid #21262d"><div class="min-w-0 flex-1"><b class="block truncate">${h(g.title)}</b><div class="d">${h(g.cat||'')} · ${fd(g.date)}</div></div><div class="rb flex gap-2"><button class="gb" data-a="ed" data-id="${h(g.id)}">Edit</button><a class="gb" href="#/g/${h(g.id)}">Play</a><button class="gb r" data-a="del" data-id="${h(g.id)}">Delete</button></div></div>`).join('')||'<p class="d">No games yet. Tap “+ New game”.</p>');return}
 const g=gs().find(x=>x.id==ES.e)||{};
 em.innerHTML=`<h2>${g.id?'Edit game':'Add game'}</h2><div class="grid gap-4"><div><label class="l">Title</label><input type="text" id="f_t" value="${h(g.title)}"></div><div class="grid grid-cols-2 gap-3"><div><label class="l">Category</label><select id="f_c">${CATS.map(c=>`<option ${g.cat==c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="l">Release date</label><input type="date" id="f_d" value="${h(g.date)}"></div></div><div><label class="l">Description</label><textarea id="f_s" rows="3">${h(g.desc)}</textarea></div><div><label class="l">Thumbnail</label><input type="file" id="f_i" accept="image/*"><div class="d mt-1">${g.thumb?'Leave empty to keep the current image.':'Optional.'}</div></div><div><label class="l">Game folder</label><input type="file" id="f_f" webkitdirectory multiple><div class="d mt-1">Pick the folder containing index.html.</div></div><div><label class="l">…or a single HTML file</label><input type="file" id="f_h" accept=".html,.htm"></div><div class="flex gap-2"><button class="gb p" data-a="save">Save game</button><button class="gb" data-a="sec" data-s="list">Cancel</button></div></div>`;
}
async function save(){
 const t=$('#f_t').value.trim();if(!t)return toast('Title is required');
 const all=gs(),old=all.find(x=>x.id==ES.e),id=old?old.id:slug(t)+'-'+Math.random().toString(36).slice(2,6);
 const g={...(old||{}),id,title:t,cat:$('#f_c').value,date:$('#f_d').value,desc:$('#f_s').value.trim()};
 const im=$('#f_i').files[0];if(im)g.thumb=await rs(im);
 let files=[...$('#f_f').files].map(f=>[f.webkitRelativePath.split('/').slice(1).join('/')||f.name,f]);const one=$('#f_h').files[0];
 if(!files.length&&one)files=[['index.html',one]];
 if(files.length){
  const hs=files.map(x=>x[0]).filter(p=>/\.html?$/i.test(p)).sort((a,b)=>(a.split('/').length-b.split('/').length)||a.localeCompare(b));
  g.entry=hs.includes('index.html')?'index.html':hs[0];if(!g.entry)return toast('No HTML file found in that selection');
  await caches.delete('g-'+id);const c=await caches.open('g-'+id);let n=0;
  for(const [p,f] of files){const x=p.split('.').pop().toLowerCase();await c.put(gurl(id,p),new Response(f,{headers:{'Content-Type':f.type&&x!='html'?f.type:MT[x]||f.type||'application/octet-stream'}}));if(++n%25==0)toast(`Saving ${n}/${files.length}…`)}
 }else if(!old)return toast('Add a game folder or HTML file');
 old?all[all.indexOf(old)]=g:all.unshift(g);ss(all);ES.s='list';ES.e=null;toast('Saved');edit();
}
function route(){
 const r=location.hash.slice(1)||'/',p=r.split('/');scrollTo(0,0);document.title='Alligator Games';
 if(p[1]=='g')return play(decodeURIComponent(p[2]||''));
 if(p[1]=='edit'){ES.s=ES.s||'list';return edit()}
 home(p[1]=='fav'?'#/fav':'#/');
}
addEventListener('hashchange',route);setInterval(favSync,2000);route();



// mobile: keep --eh (sticky editor header height) accurate, and keep focused fields visible above the keyboard
(function(){let q=0;const set=()=>{q=0;const e=$('.gh .edh');if(e)document.documentElement.style.setProperty('--eh',e.offsetHeight+'px')},sch=()=>{if(!q)q=requestAnimationFrame(set)};
 addEventListener('resize',sch);addEventListener('orientationchange',sch);if(app)new MutationObserver(sch).observe(app,{childList:true,subtree:true});sch();
 addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('.gh input,.gh textarea,.gh select')&&matchMedia('(max-width:860px)').matches)setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch{}},320)});
})();
(function(){if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update());})();
