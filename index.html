${s.type!='url'?`<div class="mt-4"><label class="l">Start file</label><select data-f="src.entry">${E.found.map(p=>`<option ${p==s.entry?'selected':''}>${h(p)}</option>`).join('')}</select><div class="d">The HTML file that launches the game. Other files, subfolders and pages in the folder stay reachable.</div></div>`:''}`},

publish:()=>`<h2 style="margin-top:0">Publish to your store</h2><p class="d mb-3">Games and creators are published through <b>catalog.txt</b> in your GitHub repo. <b>index.html does not need to be edited.</b></p><ol class="mb-4" style="list-style:decimal;padding-left:1.4rem"><li>Click <b>Generate text</b> below (it runs automatically) and copy the game line and any creator lines.</li><li>On GitHub, open <b>catalog.txt</b> (same folder as index.html) and click the pencil icon.</li><li>Paste each line on its own new line at the bottom. One line per game or creator, never split across lines.</li><li>Updating something already listed? Delete its old line first so only the new one remains.</li><li>Click <b>Commit changes</b>, wait about a minute for GitHub Pages to deploy, then hard refresh (Ctrl+Shift+R).</li></ol><button class="gb p" data-a="genp">Generate text</button> <span class="d" id="psz"></span><label class="l mt-4">Game line: ${h(E.m.title||'(no title yet)')}</label><textarea id="pg" rows="6" readonly style="font-family:monospace"></textarea><button class="gb mt-2" data-a="copyp" data-t="pg">Copy game line</button> <button class="gb mt-2" data-a="dlp" data-t="pg">Download</button><label class="l mt-5">Creator line(s)</label><div class="d mb-1">Tagged custom creators plus the one open in the Creators section. Only paste creators that are not already in catalog.txt. Alligator Games is built in and needs no line.</div><textarea id="pc" rows="5" readonly style="font-family:monospace"></textarea><button class="gb mt-2" data-a="copyp" data-t="pc">Copy creator line(s)</button> <button class="gb mt-2" data-a="dlp" data-t="pc">Download</button>`,

ton></div><textarea id="outc" rows="6" readonly class="mt-3" style="font-family:monospace"></textarea><div class="d mt-1">Paste the generated line into <b>catalog.txt</b> to publish this creator for everyone.</div>`},
reedit:()=>`<h2 style="margin-top:0">Re-edit & import</h2><p class="d mb-3">Paste exported data to decompress it and edit it again.</p><textarea id="paste" rows="8" style="font-family:monospace"></textarea><div class="mt-3 flex gap-2"><button class="gb p" data-a="loadp">Load into editor</button></div>`,

 app.innerHTML=`<div class="gh"><div class="edh flex items-center gap-3 px-6 py-3 border-b border-[#3d444d] sticky top-0 bg-[#0d1117] z-10"><span class="w-8 h-8">${LOGO}</span><b class="hide-s">Alligator Games</b><span class="d tt">/ ${h(E.m.title||'New game')} / editor</span><span class="flex-1"></span><span class="d hide-s">Editing:</span><button class="gb ${EM=='game'?'p':''}" data-a="mode" data-v="game">Game</button><button class="gb ${EM=='both'?'p':''}" data-a="mode" data-v="both">Game + creator</button><a class="gb" href="#/">Store</a><button class="gb p" data-a="save">Save</button></div><div class="edw max-w-[1280px] mx-auto flex gap-10 px-6 py-5"><nav class="sb w-[260px] shrink-0 sticky top-20 self-start">${NAV.filter(n=>EM=='both'||n[0]!='Creators').map(([t,i])=>`<h4>${t}</h4>${i.map(([k,n,ic])=>`<a data-a="sec" data-s="${k}" class="${E.sec==k?'on':''}">${IC[k]}${n}</a>`).join('')}`).join('')}</nav><main class="flex-1 max-w-[900px] min-w-0 pb-24">${S[E.sec]()}</main></div><input type="file" id="fdir" webkitdirectory multiple hidden><input type="file" id="fzip" accept=".zip,application/zip,application/x-zip-compressed" hidden><div class="edbar"><button class="gb p" data-a="save">Save</button><button class="gb" data-a="sec" data-s="quick">Quick add</button><button class="gb" data-a="sec" data-s="export">Export</button></div><input type="file" id="ffil" multiple hidden><input type="file" id="fcov" accept="image/*" hidden><input type="file" id="fshots" accept="image/*" multiple hidden><input type="file" id="fava" accept="image/*" hidden><input type="file" id="frshot" accept="image/*" hidden></div>`;const n=$('.sb'),a=$('.sb a.on');if(n&&a&&n.scrollWidth>n.clientWidth)n.scrollLeft=a.offsetLeft-n.clientWidth/2+a.clientWidth/2}

async function savecQ(){const m=cfin();if(!m.name||!m.id||m.id==BI.id){toast('Add a unique creator name first');return 0}await dset('creators',m.id,m);EC.id=m.id;if(EM=='both')E.m.cr=[...new Set([...(E.m.cr||[]),m.id])];await load();return 1}

 if(m.status!='upcoming'&&((m.src.type=='bundle'&&(!E.files.length||!m.src.entry))||(m.src.type=='url'&&!m.src.url)||(m.src.type=='folder'&&!m.src.entry)))return toast('Add the game files and a start file first');
 if(m.src.type=='bundle'&&E.files.length){const s=await pack(m,E.files);m.sig=s.length;await dset('packs',m.id,s)}

async function editg(id,both){EM=both?'both':'game';const m=await dget('games',id);m.cr=m.cr||crOf(m).map(c=>c.id);E={m,files:[],found:[],sec:'general',handle:null,idt:1};if(m.src.type=='bundle'){const p=await dget('packs',id);if(p)E.files=(await unpack(p)).files;E.found=E.files.map(f=>f.p).filter(htm)}else{E.found=[m.src.entry].filter(Boolean);E.handle=await dget('handles',id)||null}if(both){const c=C.find(y=>(m.cr||[]).includes(y.id));EC=c?{...c,linksText:(c.links||[]).map(l=>l.join(' | ')).join('\n')}:blankC()}ed()}
