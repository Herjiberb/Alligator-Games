<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PLANTS VS. LAWN MOWERS</title>
    <link href="Destroyer Tank Mower.png" rel="icon" type="image/x-icon"/>
    <style>
:root{--bg:#0e1a10;--panel:#16251a;--panel2:#1f3324;--line:#35563b;--accent:#6ddc5a;--gold:#ffd34d;--danger:#e2504a;--text:#f2f7ee;--muted:#9db8a0;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);background:#000;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
.screen{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
/* Start */
#start-screen{z-index:10;flex-direction:column;gap:clamp(10px,2.5vh,22px);background:radial-gradient(circle at 50% 40%,#3d4a12,#161c08 60%,#000);padding:16px;text-align:center}
#logo{width:min(80vw,560px);max-height:42vh;object-fit:contain;animation:surge 3s infinite alternate ease-in-out}
#title-fallback{display:none;font-size:clamp(28px,7vw,64px);font-weight:900;color:var(--gold);text-shadow:0 4px 0 #5a4300,0 0 30px #ffd34d88;margin:0}
.btn{cursor:pointer;font-weight:800;letter-spacing:.04em;border-radius:var(--r);border:2px solid transparent;padding:.7em 1.1em;font-size:clamp(12px,1.7vh + .5vw,17px);background:var(--panel2);border-color:var(--line);transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#2a4530}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.selected{background:#3a7a3a;border-color:var(--accent);box-shadow:0 0 14px #6ddc5a88}
.btn.big{font-size:clamp(20px,4vh,34px);padding:.6em 1.8em;background:linear-gradient(#3cb83c,#237a23);border-color:#164f16;box-shadow:0 6px 0 #164f16,0 0 24px #6ddc5a66}
.btn.store{background:linear-gradient(#b533b5,#7d257d);border-color:#5a1a5a}
.btn.danger{background:#7a1f1c;border-color:#a52d29}.btn.danger.selected{background:#d63b35;border-color:#ffb3b0;box-shadow:0 0 14px #ff5a5388}
.btn.warn{background:#7a5a1c;border-color:#a8832b}
.btn.speed.selected{background:#a8b92b;border-color:#f0ffb5;color:#1a2000}
.btn.good{background:linear-gradient(#3cb83c,#237a23);border-color:#164f16}
/* Game layout */
#game-container{display:none;z-index:5;background:radial-gradient(circle at 30% 20%,#1d3322,#0a120c);padding:8px;gap:8px;
 display:none;grid-template-columns:minmax(0,1fr) clamp(190px,21vw,270px);grid-template-rows:auto minmax(0,1fr) auto;
 grid-template-areas:"stage stats" "stage menu" "stage ctrl";align-items:stretch;justify-content:stretch}
#game-container.on{display:grid}
#stage{grid-area:stage;position:relative;display:flex;justify-content:center;align-items:center;min-width:0;min-height:0}
#game-wrapper{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px #5a3a10,0 0 0 6px #2a1c08,0 10px 40px #000a;background:#000;flex:none}
#game-canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#game-overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.6);color:#fff;font-weight:900;text-align:center;text-shadow:0 0 14px #000,0 3px 0 #000;pointer-events:none;z-index:10;opacity:0;transition:opacity .3s;white-space:pre-wrap;padding:10px}
#restart-button{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);z-index:11;display:none}
#stats{grid-area:stats;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:8px}
.stat{display:flex;align-items:center;gap:6px;background:#0c150e;border-radius:8px;padding:5px 8px;font-weight:800;font-size:clamp(13px,1.6vh + .4vw,18px);min-width:0;white-space:nowrap}
.stat img{height:1.4em;width:1.4em;object-fit:contain}
.stat.gold{color:var(--gold)}.stat.wide{grid-column:1/-1;justify-content:center;color:var(--muted)}
#plant-menu{grid-area:menu;display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));grid-auto-rows:min-content;gap:6px;overflow-y:auto;overflow-x:hidden;padding:2px;min-height:0;align-content:start}
#plant-menu::-webkit-scrollbar{width:6px}#plant-menu::-webkit-scrollbar-thumb{background:#456a4b;border-radius:3px}
.plant-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:5px 3px 4px;cursor:pointer;transition:transform .12s,border-color .15s,filter .2s}
.plant-card:hover{transform:translateY(-2px);border-color:#6a9a70}
.plant-card.selected{background:#2f6a35;border-color:var(--accent);box-shadow:0 0 14px #6ddc5a99}
.plant-card.poor{filter:grayscale(.8) brightness(.65)}
.plant-card.premium{border-color:var(--gold);box-shadow:0 0 12px #ffd34d88}
.plant-card img{width:clamp(34px,5.5vh,54px);height:clamp(34px,5.5vh,54px);object-fit:contain;pointer-events:none}
.plant-card .name{font-size:clamp(9px,1.3vh + .2vw,12px);font-weight:700;text-align:center;line-height:1.1;pointer-events:none}
.plant-card .cost{font-size:clamp(11px,1.5vh + .2vw,14px);font-weight:900;color:var(--gold);pointer-events:none}
#controls{grid-area:ctrl;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#controls .btn{padding:.6em .4em;text-align:center}
#controls .btn:first-child{grid-column:1/-1}
/* Portrait / narrow */
@media (max-aspect-ratio:1/1),(max-width:640px){
 #game-container{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"stats" "ctrl" "stage" "menu";padding:6px;gap:6px}
 #stats{grid-template-columns:repeat(4,auto);justify-content:space-between;padding:5px}
 .stat.wide{grid-column:auto}
 #controls{grid-template-columns:repeat(3,1fr)}#controls .btn:first-child{grid-column:auto}
 #tray-bar{display:flex}
 #plant-menu{position:fixed;left:0;right:0;bottom:0;z-index:150;max-height:68vh;overflow-y:auto;overflow-x:hidden;background:linear-gradient(#1a2e1f,#0f1a12);border-top:3px solid var(--accent);border-radius:20px 20px 0 0;padding:34px 10px calc(14px + env(safe-area-inset-bottom));grid-template-columns:repeat(auto-fill,minmax(84px,1fr));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px #000c}
 #plant-menu.open{transform:none}
 #plant-menu::before{content:'';position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#5f8a66}
 #tray-backdrop{display:block;position:fixed;inset:0;z-index:140;background:#0008;opacity:0;pointer-events:none;transition:opacity .3s}
 #tray-backdrop.open{opacity:1;pointer-events:auto}
}
#tray-bar,#tray-backdrop{display:none}
#tray-bar{grid-area:menu;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:6px 8px}
#tray-chip{flex:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray-chip img{width:34px;height:34px;object-fit:contain}
#tray-open{padding:.7em 1.2em;background:linear-gradient(#3cb83c,#237a23);border-color:#164f16;box-shadow:0 3px 0 #164f16}
.plant-card.poor::after{content:'';position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(45deg,transparent 0 6px,#0004 6px 12px)}
.plant-card.selected{animation:cardpulse 1.4s infinite}
@keyframes cardpulse{50%{box-shadow:0 0 22px #6ddc5acc}}
.plant-card{will-change:transform}.plant-card:active{transform:scale(.94)}
@media (max-aspect-ratio:1/1),(max-width:640px){#plant-menu{display:grid}}
@media (max-height:420px) and (min-aspect-ratio:1/1){#game-container{grid-template-columns:minmax(0,1fr) 190px;padding:4px;gap:4px}.stat{padding:3px 6px}#plant-menu{grid-template-columns:repeat(2,1fr)}.plant-card img{width:30px;height:30px}.plant-card .name{display:none}}
/* Context menu */
#plant-context-menu{display:none;position:fixed;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:5px;z-index:200;flex-direction:column;gap:4px;box-shadow:0 8px 30px #000b;min-width:140px}
#plant-context-menu button{background:var(--panel2);border:1px solid var(--line);padding:9px 12px;text-align:left;cursor:pointer;border-radius:6px;font-size:14px;font-weight:600}
#plant-context-menu button:hover:not(:disabled){background:#2f5036}
#plant-context-menu button:disabled{opacity:.4;cursor:not-allowed}
/* Shop */
.shop-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:500;padding:10px}
#shop-modal-content{background:#221a2a;border:3px solid var(--gold);border-radius:16px;padding:clamp(14px,3vw,26px);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;box-shadow:0 0 40px #ffd34d66;position:relative}
#shop-modal-content h2{margin:0;text-align:center;color:var(--gold);font-size:clamp(20px,4vw,30px)}
#shop-modal-content .sub{text-align:center;color:var(--muted);margin:.3em 0 0}
#shop-close-button{position:absolute;top:6px;right:12px;font-size:2em;background:none;border:none;cursor:pointer;line-height:1;color:#fff}
#shop-close-button:hover{color:var(--danger)}
#shop-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:16px}
.shop-item{background:#33283d;border:2px solid #5a4670;border-radius:12px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px}
.shop-item h3{margin:0;color:var(--gold);font-size:1.05em}.shop-item.hack h3{color:#ff9b96}
.shop-item p{margin:0;color:#ddd;font-size:.9em;flex:1}
#shop-transaction-screen,#shop-complete-screen{display:none;flex-direction:column;align-items:center;text-align:center;padding:10px}
#shop-progress-bar-container{width:100%;background:#444;border-radius:8px;height:24px;margin-top:16px;overflow:hidden}
#shop-progress-bar{width:0;height:100%;background:linear-gradient(#5be05b,#2f9a2f);transition:width .1s linear}
@keyframes surge{0%,100%{filter:brightness(.95) drop-shadow(0 0 10px #ffff00)}50%{filter:brightness(1.5) drop-shadow(0 0 30px #ffffaa)}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
    
#start-screen{overflow:hidden;gap:0;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 40%,#3d4a12,#161c08 60%,#000)}
#start-screen::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 38%,rgba(20,10,30,.45));z-index:0}
#start-screen>*{position:relative;z-index:1}
#logo{width:min(78vw,520px);max-height:30vh;filter:drop-shadow(0 6px 0 #0006);animation:bob 6s ease-in-out infinite}
#title-fallback{display:none;font-size:clamp(28px,7vh,60px);line-height:1;letter-spacing:.04em;font-weight:900;margin:0;text-transform:uppercase;text-align:center;animation:bob 6s ease-in-out infinite}
#title-fallback .t1{color:#e9e9e9;text-shadow:0 3px 0 #8a8a8a,0 6px 0 #333,0 9px 10px #0007}
#title-fallback .t2{color:#a6ea5c;text-shadow:0 3px 0 #4b8f22,0 6px 0 #1f3d0d,0 9px 10px #0007}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#menu-head{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:clamp(14px,4vh,40px)}
#menu-buttons{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);width:min(88vw,380px)}
.mc-btn{width:100%;height:clamp(38px,6.6vh,48px);cursor:pointer;font-weight:800;font-size:clamp(14px,2.4vh,19px);letter-spacing:.06em;color:#fff;text-shadow:2px 2px 0 #0007;
 background:linear-gradient(#8b8b8b,#6a6a6a 50%,#5c5c5c);border:2px solid #111;border-radius:3px;
 box-shadow:inset 2px 2px 0 #c9c9c9,inset -2px -2px 0 #3a3a3a,0 3px 0 #0006;transition:background .12s,color .12s,transform .1s;padding:0}
.mc-btn:hover,.mc-btn:focus-visible{background:linear-gradient(#8d9fd6,#6f82bd 50%,#5f72ad);color:#ffffa8;outline:2px solid #fff;outline-offset:-4px;transform:translateY(-1px)}
.mc-btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 #3a3a3a,inset -2px -2px 0 #c9c9c9}
.mc-btn.play{background:linear-gradient(#7fd05a,#4aa02b 50%,#3d8a22);box-shadow:inset 2px 2px 0 #c8f2a8,inset -2px -2px 0 #1f5a0e,0 3px 0 #0006}
.mc-btn.play:hover,.mc-btn.play:focus-visible{background:linear-gradient(#9be874,#5cba3a 50%,#4aa02b)}
.mc-btn.shop{background:linear-gradient(#b86fd6,#8a3fb0 50%,#772f9b);box-shadow:inset 2px 2px 0 #e3baf2,inset -2px -2px 0 #3f1558,0 3px 0 #0006}
.mc-btn.shop:hover,.mc-btn.shop:focus-visible{background:linear-gradient(#cf8cec,#9d52c4 50%,#8a3fb0)}
.mc-btn.dex{background:linear-gradient(#4fc3c3,#2a9494 50%,#217a7a);box-shadow:inset 2px 2px 0 #aef0f0,inset -2px -2px 0 #0f4444,0 3px 0 #0006}
.mc-btn.dex:hover,.mc-btn.dex:focus-visible{background:linear-gradient(#6fdada,#37aaaa 50%,#2a9494)}
#menu-buttons .mc-btn{opacity:0;animation:rise .45s ease-out forwards}
#menu-buttons .mc-btn:nth-child(2){animation-delay:.08s}#menu-buttons .mc-btn:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#menu-foot{position:absolute;left:10px;right:10px;bottom:6px;display:flex;justify-content:space-between;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:2}
@media (prefers-reduced-motion:reduce){#logo,#title-fallback}
    </style>
</head>
<body>
    <div id="start-screen" class="screen">
        <div id="menu-head">
            <img id="logo" src="PLANTS VS LAWN MOWERS.png" alt="PLANTS VS. LAWN MOWERS" onerror="this.style.display='none';document.getElementById('title-fallback').style.display='block'">
            <h1 id="title-fallback"><span class="t1">Plants vs.</span><br><span class="t2">Lawn Mowers</span></h1>
        </div>
        <div id="menu-buttons">
            <button id="play-button" class="mc-btn play">PLAY</button>
            <button id="shop-button" class="mc-btn shop">STORE ($)</button>
            <button id="bestiary-button" class="mc-btn dex">BESTIARY</button>
        </div>
        <div id="menu-foot"><span>Plants vs. Lawn Mowers</span><span>Please do not distribute!</span></div>
    </div>

    <div id="game-container" class="screen">
        <div id="stats">
            <div class="stat gold"><span>$</span><span id="currency-display">30</span></div>
            <div class="stat"><img src="Seeds.png" alt="Seeds" onerror="this.style.display='none'"><span id="seeds-display">0</span></div>
            <div class="stat"><img src="Boost.png" alt="Boosts" onerror="this.style.display='none'"><span id="boosts-display">0</span></div>
            <div class="stat wide" id="wave-display">Wave: 0/0</div>
        </div>
        <div id="stage">
            <div id="game-wrapper">
                <canvas id="game-canvas"></canvas>
                <div id="game-overlay"></div>
                <button id="restart-button" class="btn big">PLAY AGAIN</button>
            </div>
        </div>
        <div id="tray-bar"><div id="tray-chip">Pick a seed</div><button id="tray-open" class="btn">SEEDS &#9650;</button></div>
        <div id="plant-menu"></div>
        <div id="tray-backdrop"></div>
        <div id="controls">
            <button id="uproot-button" class="btn danger">UPROOT</button>
            <button id="pause-button" class="btn warn">PAUSE</button>
            <button id="2x-speed-button" class="btn speed">2x SPEED</button>
        </div>
    </div>

    <div id="plant-context-menu"></div>
    <div id="shop-modal-overlay" class="shop-overlay">
        <div id="shop-modal-content">
            <button id="shop-close-button" aria-label="Close">&times;</button>
            <h2>PREMIUM STORE</h2>
            <p class="sub">Get the unfair advantage you deserve!</p>
            <div id="shop-items"></div>
            <div id="shop-transaction-screen">
                <h3 style="color:#ffb5b5">Processing Payment...</h3>
                <p>Transacting Your Card Funds. Do Not Close This Window.</p>
                <div id="shop-progress-bar-container"><div id="shop-progress-bar"></div></div>
            </div>
            <div id="shop-complete-screen">
                <h3 style="color:#b5ffb5">Transaction Complete!</h3>
                <p id="shop-complete-message"></p>
                <button id="shop-complete-ok-button" class="btn good">Awesome!</button>
            </div>
        </div>
    </div>

    <script>
        // === GAME SETUP ===
        window.addEventListener('load', init);

        // DOM Elements
        const canvas = document.getElementById('game-canvas'); const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen'); const gameContainer = document.getElementById('game-container');
        const playButton = document.getElementById('play-button'); const currencyDisplay = document.getElementById('currency-display');
        const plantMenu = document.getElementById('plant-menu'); const pauseButton = document.getElementById('pause-button'); const twoxSpeedButton = document.getElementById('2x-speed-button');
        const gameOverlay = document.getElementById('game-overlay');
        const uprootButton = document.getElementById('uproot-button');
        const waveDisplay = document.getElementById('wave-display');
        const seedsDisplay = document.getElementById('seeds-display');
        const boostsDisplay = document.getElementById('boosts-display');
        const contextMenu = document.getElementById('plant-context-menu');
        let activeContextMenuPlant = null;
        // Shop modal elements (assigned in init)
        let shopButton, shopOverlay, shopCloseButton, shopItems, shopTransactionScreen, shopProgressBar, shopCompleteScreen, shopCompleteMessage, shopCompleteOkButton;
        const restartButton = document.getElementById('restart-button');
        let gameStarted = false;

        // Game Constants
        const ROWS = 8; const COLS = 15; const TILE_SIZE = 80;
        const CANVAS_WIDTH = COLS * TILE_SIZE; const CANVAS_HEIGHT = ROWS * TILE_SIZE;
        const FOG_FADE_FRAMES = 72, LOOSE_FADE_FRAMES = 48, PLANT_DUST_FRAMES = 60;
        const FPS = 60;

        // Asset paths (built from the data tables below)
        const TIME_KEYS = new Set(['shootInterval','productionInterval','divertCooldown','weakDuration','beamDuration','healInterval','attackInterval','rowChangeInterval','summonInterval','generalCooldown']);
        const withTimes = (o) => { for (const k in o) if (TIME_KEYS.has(k)) o[k] *= FPS; return o; };
        const IMAGE_SOURCES = {};
        const addImg = (key, file) => { IMAGE_SOURCES[key] = file + '.png'; };
        [['tile','Oily Grass Patch'],['burnt_tile','Burnt Grass Patch'],['lava_tile','Lava Grass Patch'],['tile_water','Water Patch'],
         ['icon_seed','Seeds'],['icon_boost','Boost'],['env_fog','Fog'],['plant_god_potato','God Potato']].forEach(r => addImg(...r));

        // Plant rows: [KEY, name, cost, health, imageKey, imageFile, behavior, extras(seconds for time values)]
        const shooter = (interval, projectile, shotLimit) => ({ shootInterval: interval, projectile, shotLimit });
        const PLANT_ROWS = [
            ['MONION','Monion',5,50,'plant_monion','Monion','PRODUCER',{productionInterval:12,productionAmount:1,productionLimit:25}],
            ['BULB_BOPPER','Bulb Bopper',7,50,'plant_bulb','Bulb Bopper','SHOOTER',shooter(3,'BULB',50)],
            ['CARB_CANNON','Carb Cannon',8,50,'plant_carb_cannon','Carb Cannon','SHOOTER',shooter(3,'CARB',45)],
            ['DOUBLE_BULB_BOPPER','Double Bopper',15,50,'plant_double_bulb','Double Bulb Bopper','SHOOTER',shooter(3.2,'BULB',55)],
            ['TRIPLE_BULB_BOPPER','Triple Bopper',24,50,'plant_triple_bulb','Triple Bulb Bopper','SHOOTER',shooter(3.5,'BULB',65)],
            ['BACK_BULB_BOPPER','Back Bopper',7,50,'plant_back_bulb','Back Bulb Bopper','SHOOTER',shooter(3,'BULB',45)],
            ['FLIP_BULB_BOPPER','Flip Bopper',14,50,'plant_flip_bulb','Flip Bulb Bopper','SHOOTER',shooter(3,'BULB',45)],
            ['BEEFY_BEETROOT','Beefy Beetroot',13,700,'plant_beetroot','Beefy Beetroot','SHOOTER',shooter(3.5,'BULB',40)],
            ['PEPPER_POPPER','Pepper Popper',15,50,'plant_pepper','Pepper Popper','SHOOTER',shooter(4,'PEPPER',45)],
            ['PATHBLOCKER_POTATO','Pathblocker Potato',4,1000,'plant_potato','Pathblocker Potato','WALL',{}],
            ['RUSTROOT_SPUD','Rustroot Spud',10,2500,'plant_rustroot','Rustroot Spud','WALL',{}],
            ['WILLFUL_WATERMELON','Willful Watermelon',30,7500,'plant_willful_watermelon','Willful Watermelon','WALL',{}],
            ['DEADLY_DURIAN','Deadly Durian',9,1000,'plant_durian','Deadly Durian','SPIKE',{damage:0.05}],
            ['JAGGED_JACKFRUIT','Jagged Jackfruit',23,2500,'plant_jackfruit','Jagged Jackfruit','SPIKE',{damage:0.06}],
            ['THORNY_THISTLE','Thorny Thistle',12,50,'plant_thistle','Thorny Thistle','SPIKE',{damage:0.1,isTargetable:false}],
            ['RAVAGER_ROSEBUSH','Ravager Rosebush',24,50,'plant_rosebush','Ravager Rosebush','SPIKE',{damage:0.2,isTargetable:false}],
            ['FORTUNION','Fortunion',15,50,'plant_fortunion','Fortunion','PRODUCER',{productionInterval:10,productionAmount:1,productionLimit:75}],
            ['COMBUSTION_COCONUT','Combustion Coconut',40,4000,'plant_combustion_coconut','Combustion Coconut','WALL',{}],

        class Plant {
            constructor(row, col, typeKey) {
                const typeData = PLANT_TYPES[typeKey];
                this.row = row; this.col = col;
                this.typeKey = typeKey;
                this.x = col * TILE_SIZE; this.y = row * TILE_SIZE; this.width = TILE_SIZE * 0.9; this.height = TILE_SIZE * 0.9;
                this.health = typeData.health; this.maxHealth = typeData.health;
                this.originalMaxHealth = typeData.health;
                this.behavior = typeData.behavior; this.image = images[typeData.imageKey];
                this.isTargetable = typeData.isTargetable;
                this.isHypnotizer = typeData.isHypnotizer || false;
                this.actionTimer = 0; this.glowTimer = 0;
                this.usageCount = 0; this.isSlowed = false; this.removed = false;
                this.isBoosted = false; this.boostTimer = 0;
                this.isDefeated = false;
                // NEW: Animation properties
                this.anim = { state: 'IDLE', timer: 0, origY: this.y, velY: 0 };

                // --- MODIFIED: Renamed 'orbs' to 'ammo' ---
                if (this.typeKey === 'CRISIS_CARROT') { // Name change
                    this.ammo = PLANT_TYPES[this.typeKey].shotLimit; // Use shotLimit
                    this.ammoCooldown = 0;
                    this.ammoAnimTimer = Math.random() * 1000; // Random start for anim
                }
                // --- END MODIFIED ---
                
                // NEW: DIVERTER properties
                if (this.behavior === 'DIVERTER') {
                    this.divertTimer = 0;
                    this.isWeak = false;
                    this.weakTimer = 0;
                }
            }
            update(enemiesOnRow) {
                if (this.removed) return;
                this.actionTimer++; if (this.glowTimer > 0) this.glowTimer--;
                
                if (this.isBoosted && this.behavior !== 'WALL') {
                    this.boostTimer--;
                    if (this.boostTimer <= 0) this.isBoosted = false;
                }

                const typeData = PLANT_TYPES[this.typeKey];
                switch (this.behavior) {
                    case 'SHOOTER': {
                        let interval = typeData.shootInterval;
						if (this.isSlowed) interval *= 2;
                        if (this.isBoosted) interval /= 5;
                        if (enemiesOnRow.length > 0 && this.actionTimer >= interval) {
                            this.shoot(); this.actionTimer = 0;
                            if (!this.isSlowed) {
                                this.usageCount++;
                                if (typeData.shotLimit && this.usageCount >= typeData.shotLimit) this.isSlowed = true;
                            }
                        }
                        break;
                    }
                    case 'PRODUCER': {
                        let interval = typeData.productionInterval;
                        if (this.isSlowed) interval *= 2;
						if (this.isBoosted) interval /= 5;
                        if (this.actionTimer >= interval) {
                            currency += typeData.productionAmount; updateTopBar(); this.actionTimer = 0; this.glowTimer = 30;
                            floatingIcons.push(new FloatingIcon(this.x, this.y, 'currency'));
                            if (!this.isSlowed) {
                                this.usageCount += typeData.productionAmount;
                                if (typeData.productionLimit && this.usageCount >= typeData.productionLimit) this.isSlowed = true;
                            }
                        }
                        break;
                    }
                    case 'ZAPPER': {
						let interval = typeData.shootInterval;
						if (this.isSlowed) interval *= 2;
						if (this.isBoosted) interval /= 5;

						if (this.actionTimer >= interval && enemies.length > 0) {
                            let target = null;
                            
                            // Find all enemies in the "danger zone" (e.g., columns 0-4)
                            const dangerZoneEnemies = enemies.filter(e => {
                                const c = Math.floor((e.x + e.width / 2) / TILE_SIZE);
                                return c >= 0 && c <= 4;
                            });

                            if (dangerZoneEnemies.length > 0) {
                                // Target the leftmost (most dangerous) enemy in the danger zone
                                target = dangerZoneEnemies.reduce((best, cur) => (!best || cur.x < best.x) ? cur : best);
                            } else {
                                // If no one is close, just target the leftmost enemy on screen
                                target = enemies.reduce((best, cur) => (!best || cur.x < best.x) ? cur : best);
                            }

							if (target) {
								this.shoot(target);
								this.actionTimer = 0;
								if (!this.isSlowed) {
									this.usageCount++;
									if (typeData.shotLimit && this.usageCount >= typeData.shotLimit) this.isSlowed = true;
								}
							}
						}
						break;
					}
                    // --- MODIFIED & FIXED: HEAVY ZAPPER (Crisis Carrot) ---
                    case 'HEAVY_ZAPPER': {
                        this.ammoAnimTimer++; // For ammo animation
                        
                        // Check for self-destruct *first*
                        if (this.ammo <= 0) {
                            if (this.anim.state !== 'SELF_DESTRUCT') {
                                this.anim.state = 'SELF_DESTRUCT';
                                this.anim.timer = 0;
                                this.ammoCooldown = 99999; // Prevent firing while dying
                            }
                            return; // Stop all other logic
                        }
                        
                        if (this.ammoCooldown > 0) {
                             this.ammoCooldown--;
                             break; // On cooldown, do nothing else
                        }

                        // Target enemies in the leftmost 5 columns
                        const dangerZoneEnemies = enemies.filter(e => {
                            return e.x < TILE_SIZE * 5 && !e.isHypnotized;
                        });

                        if (dangerZoneEnemies.length > 0) {
                            // Target the leftmost (most dangerous) one
                            let target = dangerZoneEnemies.reduce((best, cur) => (!best || cur.x < best.x) ? cur : best);
                            
                            if (target) {
                                // Consume ammo and attack!
                                this.ammo--;
                                this.ammoCooldown = 2 * FPS; // 2 second cooldown
                                
                                projectiles.push(new Projectile(this.x + this.width / 2, this.y + this.height / 2, this.row, 'HEAVY_ZAP_ATTACK', 1, target));
                            }
                        }
                        break;
                    }
                    // --- END MODIFIED ---
                    // --- NEW: DIVERTER (Mythical Myrtle) ---
                    case 'DIVERTER': {
						const typeData = PLANT_TYPES[this.typeKey];

						// Always tick both timers if present
						if (this.weakTimer > 0) this.weakTimer--;
						if (this.divertTimer > 0) this.divertTimer--;

						// Manage weak flag separately (so we don't rely on branching order)
						if (this.weakTimer <= 0) {
							this.isWeak = false;
						}

						// Find enemies in this tile (visual overlap)
						const enemiesOnTile = enemies.filter(e =>
							!e.isHypnotized &&
							Math.abs(e.y - this.y) < TILE_SIZE / 2 &&
							rectsOverlap(this, e)
							//&& e.typeKey !== 'SKULLCRUSHER' && e.typeKey !== 'DESTROYER_TANK'
							);

						if (enemiesOnTile.length > 0 && !this.isWeak && this.divertTimer <= 0) {
							const enemy = enemiesOnTile[0];

							// Choose direction
							let targetRow;
							if (this.row === 0) targetRow = 1;
							else if (this.row === ROWS - 1) targetRow = ROWS - 2;
							else targetRow = this.row + (Math.random() < 0.5 ? -1 : 1);

							// Force the enemy to move rows — set both targetY and the visual y for reliability
							enemy.targetY = targetRow * TILE_SIZE;
							enemy.row = targetRow;
							enemy.rowChangeTimer = 0;
							// Optionally teleport (uncomment if you want instant change)
							// enemy.y = targetRow * TILE_SIZE;

							// Enter weak + start cooldown immediately (cooldown includes weak duration if you want)
							this.isWeak = true;
							this.weakTimer = typeData.weakDuration;
							// Start cooldown now so there's no race later
							this.divertTimer = typeData.divertCooldown;
							this.glowTimer = 30;
						}
						break;
					}
                    // --- END NEW ---
                    // --- NEW: BEAM (Laser Lilac) ---
                    case 'BEAM': {
                        const typeData = PLANT_TYPES[this.typeKey];
                        let interval = typeData.shootInterval;
                        if (this.isSlowed) interval *= 2;
                        if (this.isBoosted) interval /= 5;
                        
                        // Check for any non-hypnotized enemy in the row
                        const enemyInRow = enemiesOnRow.some(e => !e.isHypnotized);
                        
                        if (enemyInRow && this.actionTimer >= interval) {
                            this.actionTimer = 0;
                            const pY_center = this.y + this.height / 2;
                            beams.push(new Beam(this.x + this.width - 10, pY_center - (TILE_SIZE * 0.1), this.row, typeData.beamDuration, typeData.beamDamage, this));
                            
                            if (!this.isSlowed) {
                                this.usageCount++;
                                // Note: No shotLimit defined for this one, but could be added
                            }
                        }
                        break;
                    }
                    case 'HEALER': {
                        let interval = typeData.healInterval || (0.1 * FPS);
                        // Healer isn't affected by "slowed" status
                        if (this.isBoosted) interval /= 5;
                        
                        if (this.actionTimer >= interval) {
                            this.actionTimer = 0;
                            // Find plant in front (col + 1)
                            if (this.col < COLS - 1) {
                                const plantInFront = gameGrid[this.row][this.col + 1];
                                if (plantInFront && plantInFront.health < plantInFront.maxHealth) {
                                    plantInFront.health += typeData.healAmount || 0.1;
                                    plantInFront.health = Math.min(plantInFront.health, plantInFront.maxHealth);
                                    
                                    // Add a small glow to show healing
                                    if (plantInFront.glowTimer <= 0) plantInFront.glowTimer = 5;
                                }
                            }
                        }
                        break;
                    }
                }
            }
            shoot(target = null) {
                const projectileType = PLANT_TYPES[this.typeKey].projectile;
                const pY_center = this.y + this.height / 2;
                if (this.behavior === 'ZAPPER' && target) {
                    projectiles.push(new Projectile(this.x + this.width / 2, pY_center - 10, this.row, projectileType, 1, target));
                    return;
                }
                if (this.typeKey === 'BACK_BULB_BOPPER') {
                    let pX = this.x; projectiles.push(new Projectile(pX, pY_center - 10, this.row, projectileType, -1));
                } else if (this.typeKey === 'FLIP_BULB_BOPPER') {
                    projectiles.push(new Projectile(this.x, pY_center - 10, this.row, projectileType, -1));
                    projectiles.push(new Projectile(this.x + this.width - 20, pY_center - 10, this.row, projectileType, 1));
                } else {
                    let pX = this.x + this.width - 20;
                    if (this.typeKey === 'DOUBLE_BULB_BOPPER') {
                        projectiles.push(new Projectile(pX, pY_center - 15, this.row, projectileType, 1));
                        projectiles.push(new Projectile(pX, pY_center + 5, this.row, projectileType, 1));
                    } else if (this.typeKey === 'TRIPLE_BULB_BOPPER') {
                        projectiles.push(new Projectile(pX, pY_center - 30, this.row, projectileType, 1));
                        projectiles.push(new Projectile(pX, pY_center -10, this.row, projectileType, 1));
						projectiles.push(new Projectile(pX, pY_center +10, this.row, projectileType, 1));
                    } else {
                        projectiles.push(new Projectile(pX, pY_center - 10, this.row, projectileType, 1));
                    }
                }
            }
            // --- MODIFIED: Added double damage for 'weak' state ---
            takeDamage(amount) { 
                if (this.removed) return;

                if (this.isWeak) amount *= 2; // Take double damage while weak

                this.health -= amount; 
                if (this.health <= 0) this.remove();
            }
            // --- END MODIFIED ---
            remove(isWinAnimation = false) { // MODIFIED: Added flag
                if (!this.removed) {
                    // NEW: Wet Waterlily Logic
                    const plantData = PLANT_TYPES[this.typeKey];
                    if (plantData.createsWater && !isWinAnimation) {
                        // Remove any existing patch first
                        waterPatches = waterPatches.filter(p => p.row !== this.row || p.col !== this.col);

                    // END NEW

                                        // Fix: Always unslow plants

                                        // NEW: Restore ammo to Crisis Carrot

									}

							}
						}
						const explosionRect = {

						};
						enemies.forEach(enemy => {
						   if (rectsOverlap(enemy, explosionRect)) enemy.takeDamage(200);

					}

                    // --- MODIFIED: Renamed 'orbs' to 'ammo' ---
                    if (this.typeKey === 'CRISIS_CARROT' && this.ammo > 0 && !isWinAnimation) {
                        const unboostedPlants = plants.filter(p => !p.isBoosted && p !== this);
                        unboostedPlants.sort(() => 0.5 - Math.random()); // Shuffle
                        
                        for (let i = 0; i < this.ammo; i++) {
                            const targetPlant = unboostedPlants[i];
                            if (targetPlant) {
                                projectiles.push(new Projectile(this.x + this.width / 2, this.y + this.height / 2, this.row, 'HEAVY_ZAP_BOOST', 1, targetPlant));

                        }
                    }
                    // --- END MODIFIED ---

                    }
                    this.removed = true;
                    if (gameGrid[this.row] && gameGrid[this.row][this.col] === this) gameGrid[this.row][this.col] = null;
                    const idx = plants.indexOf(this);

            }
            draw() {
                if (this.removed) return;
                ctx.save();
                
                let animScale = (this.anim && this.anim.scale) ? this.anim.scale : 1.0;
                let isGlowing = (this.anim && this.anim.glow);
                
                let defeatProgress = 0;
                // --- MODIFIED: Crisis Carrot Self-Destruct Visual ---
                if (!isGameOverAnimation && this.typeKey === 'CRISIS_CARROT' && this.anim.state === 'SELF_DESTRUCT') {
                    this.anim.timer++;
                    const glowAmount = 1 + (this.anim.timer / 10);
                    ctx.filter = `brightness(${glowAmount}) saturate(${glowAmount * 2})`;
                    if (this.anim.timer > 30) {

                        this.remove(true);
                    }
                }
                // --- END MODIFIED ---
                else if (this.isDefeated) {
                    this.defeatT = Math.min(PLANT_DUST_FRAMES, (this.defeatT || 0) + 1);
                    const t = this.defeatT;
                    defeatProgress = Math.min(1, t / PLANT_DUST_FRAMES);
                    const px = this.x + this.width / 2, py = this.y + this.height;
                    ctx.translate(px, py);
                    ctx.rotate(Math.sin(t * 0.16) * 0.045 * (1 - defeatProgress));
                    ctx.scale(1 - 0.045 * defeatProgress, 1 - 0.12 * defeatProgress);
                    ctx.translate(-px, -py);
                } else {
                    const isBoostedWall = this.behavior === 'WALL' && this.health > this.originalMaxHealth;
                    
                    if (isGlowing) {
                         ctx.filter = 'brightness(2.0) saturate(3.0)';
                    // --- NEW: Mythical Myrtle 'weak' visual ---
                    } else if (this.isWeak) {
                        // Pulsing gray effect
                        const pulse = Math.abs(Math.sin(this.weakTimer * 0.2));
                        ctx.filter = `grayscale(1) brightness(${1.0 + pulse * 0.5})`;
                    // --- END NEW ---
                    } else if (this.isBoosted || isBoostedWall) {
                        ctx.filter = 'saturate(5) brightness(1.5) hue-rotate(-50deg)';
                    } else if (this.isSlowed) {
                        ctx.filter = this.glowTimer > 0 ? 'grayscale(100%) saturate(0%) brightness(1.2)' : 'grayscale(100%) saturate(0%) brightness(0.7)';
                    } else if (this.glowTimer > 0) {
                        ctx.filter = `brightness(1.5) saturate(1.5)`;
                    }
                }
                
                const drawW = this.width * animScale;
                const drawH = this.height * animScale;
                const drawX = this.x - (drawW - this.width) / 2;
                const drawY = this.y - (drawH - this.height) / 2;
                
                if (this.isDefeated) {
                    // A diagonal mask removes the plant from its upper-left corner toward its lower-right.
                    const threshold = defeatProgress * 2;
                    const minX = Math.max(0, threshold - 1), maxX = Math.min(1, threshold);
                    const points = threshold <= 1
                        ? [[threshold, 0], [1, 0], [1, 1], [0, 1], [0, threshold]]
                        : [[threshold - 1, 1], [1, threshold - 1], [1, 1]];
                    ctx.save();
                    // The plague drains the plant to cold, high-contrast grey before it crumbles.
                    ctx.filter = `grayscale(1) contrast(1.3) brightness(${0.76 - defeatProgress * .16})`;
                    ctx.globalAlpha *= 1 - defeatProgress * .24;
                    ctx.beginPath();
                    points.forEach((pt, i) => {
                        const x = drawX + pt[0] * drawW, y = drawY + pt[1] * drawH;
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    });
                    ctx.closePath(); ctx.clip();
                    drawImageOrFallback(ctx, this.image, drawX, drawY, drawW, drawH);
                    ctx.restore();

                    // Fine earthy flecks ride the advancing diagonal edge as the plant crumbles into dust.
                    if (defeatProgress > 0 && defeatProgress < 1) {
                        ctx.save(); ctx.filter = 'none';
                        for (let i = 0; i < 13; i++) {
                            const u = (i + .5) / 13;
                            const nx = minX + (maxX - minX) * u;
                            const ny = threshold - nx;
                            const age = Math.max(0, Math.min(18, this.defeatT - i * 2));
                            const flicker = Math.sin((i + 1) * 8.17 + this.defeatT * .13);
                            const alpha = Math.max(0, 1 - age / 19) * Math.min(1, age / 3) * .72;
                            if (alpha <= 0) continue;
                            ctx.globalAlpha = alpha;
                            ctx.fillStyle = ['#303a32', '#667064', '#a1a99a'][i % 3];
                            const size = 2 + (i % 3);
                            ctx.fillRect(drawX + nx * drawW + age * .32 + flicker * 2, drawY + ny * drawH - age * .22 + flicker * 2, size, size);
                        }
                        ctx.restore();
                    }
                } else {
                    ctx.filter = 'none';
                    if (this.isWeak || this.isSlowed) {
                        // drained plants: colourless sprite (cached, so no per-frame filter cost)
                        const im = this.image, ok = im && im.complete && im.naturalHeight > 0;
                        if (ok && this.isWeak) {
                            const pulse = Math.abs(Math.sin(this.weakTimer * 0.2));
                            ctx.drawImage(greySprite(im, 0.85), drawX, drawY, drawW, drawH);
                            ctx.globalAlpha *= 1; const ga = ctx.globalAlpha; ctx.globalAlpha = ga * pulse * 0.6;
                            ctx.drawImage(greySprite(im, 1.7), drawX, drawY, drawW, drawH); ctx.globalAlpha = ga;
                        } else if (ok) {
                            ctx.drawImage(greySprite(im, this.glowTimer > 0 ? 1.2 : 0.7), drawX, drawY, drawW, drawH);
                        } else drawImageOrFallback(ctx, this.image, drawX, drawY, drawW, drawH);
                    } else drawImageOrFallback(ctx, this.image, drawX, drawY, drawW, drawH);
                }
                ctx.filter = 'none';


                if (this.typeKey === 'CRISIS_CARROT' && this.ammo > 0 && this.anim.state !== 'SELF_DESTRUCT' && !this.isDefeated) {
                    const ammoImg = images.projectile_heavy_zap;
                    const radius = TILE_SIZE * 0.6;
                    const centerX = this.x + this.width / 2;
                    const centerY = this.y + this.height / 2;
                    const angleBase = this.ammoAnimTimer * 0.05; // This line creates the spin
                    
                    ctx.save();
                    ctx.filter = 'brightness(1.5) drop-shadow(0 0 5px #FFF)';
                    if (this.ammo >= 1) {
                        const angle1 = angleBase;
                        drawImageOrFallback(ctx, ammoImg, centerX + Math.cos(angle1) * radius - 15, centerY + Math.sin(angle1) * radius - 15, 30, 30);
                    }
                    if (this.ammo >= 2) {
                        const angle2 = angleBase + (Math.PI * 2 / 3);
                        drawImageOrFallback(ctx, ammoImg, centerX + Math.cos(angle2) * radius - 15, centerY + Math.sin(angle2) * radius - 15, 30, 30);
                    }
                    if (this.ammo >= 3) {
                        const angle3 = angleBase + (Math.PI * 4 / 3);
                        drawImageOrFallback(ctx, ammoImg, centerX + Math.cos(angle3) * radius - 15, centerY + Math.sin(angle3) * radius - 15, 30, 30);
                    }
                    ctx.restore();
                }
                if (!this.isDefeated && !this.isWeak && (this.isBoosted || (this.behavior === 'WALL' && this.health > this.originalMaxHealth))) drawBoostFx(ctx, this);

                // --- END MODIFIED ---

                if (this.maxHealth && !this.isDefeated) {
                    const isBoostedWall = this.behavior === 'WALL' && this.health > this.originalMaxHealth;
                    if (isBoostedWall) {
                        const bonusHealth = this.health - this.originalMaxHealth;
                        drawHealthBar(ctx, this.x, this.y, this.width, this.height, this.originalMaxHealth, this.originalMaxHealth);
                        drawHealthBar(ctx, this.x, this.y, this.width, this.height, bonusHealth, this.originalMaxHealth, '#FFD700');
                    } else {
                        drawHealthBar(ctx, this.x, this.y, this.width, this.height, this.health, this.maxHealth);
                    }
                }
                ctx.restore();
            }
        }

        class Enemy {
             constructor(row, typeKey) {

                this.isAttacking = false; this.attackTimer = 0;

				this.rowChangeTimer = 0; this.pushCooldown = 0; this.isPushing = false;

				this._hasSplit = false

				this.carriedPlantImage = null; // NEW

            }

            // NEW: Logic for hypnotized mowers
            updateHypnotized(allEnemies) {
                const typeData = ENEMY_TYPES[this.typeKey];
                let potentialTargets = allEnemies.filter(e =>
                    e !== this &&
                    !e.isHypnotized &&
                    Math.max(0, Math.min(ROWS - 1, Math.round(e.y / TILE_SIZE))) === this.row &&
                    rectsOverlap(this, e)
                );

                let firstTarget = null;
                if (potentialTargets.length > 0) {
                    // Find rightmost target
                    firstTarget = potentialTargets.reduce((closest, current) => (current.x > closest.x) ? current : closest);
                }

                if (firstTarget) {
                    this.isAttacking = true; this.attackTimer++;
                    if (this.attackTimer >= this.attackInterval) {
                        firstTarget.takeDamage(this.attackDamage);
                        this.attackTimer = 0;
                    }
                } else {
                    this.isAttacking = false; this.attackTimer = 0;
                }

                if (!this.isAttacking) {
                    this.x += this.speed;
                }
                if (this.x > CANVAS_WIDTH) this.health = 0;
            }

            // NEW: Hypnotize method

                this.isHypnotized = true;

            update(plantsOnRow, allEnemies) { // NEW: Added allEnemies
                if(this.isLeaving) {
                    this.x += this.speed;

                    const c = Math.floor((this.x + this.width / 2) / TILE_SIZE);
                    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
                    if (this.typeKey === 'FIRE_MOWER') {

                         for(let r_offset = -1; r_offset <= 1; r_offset++) {

                                const desatR = r + r_offset;
                                const desatC = c + c_offset;
                                if (desatR >= 0 && desatR < ROWS && desatC >= 0 && desatC < COLS) {
                                     if (!isTileDesaturated(desatR, desatC)) desaturatedTiles.push({ row: desatR, col: desatC });
                                }

                        }

                    const tigerCount = tigerMowers.length;
                    
                    if (tigerCount > 1) {
                        const speedBuff = Math.pow(1.25, tigerCount - 1);
                        const damageBuff = Math.pow(1.25, tigerCount - 1);
                        this.speed = baseStats.speed * speedBuff;
                        this.attackDamage = baseStats.attackDamage * damageBuff;

                        if (firstTarget.isHypnotizer && firstTarget.health - this.attackDamage <= 0) { // USE INSTANCE PROP
                            // MODIFIED: Added immunity check
                            if (this.typeKey !== 'SKULLCRUSHER' && this.typeKey !== 'DESTROYER_TANK') {
                                this.hypnotize();
                            }
                        }

                        if (typeData.behavior === 'reaper') {
                            const plantData = PLANT_TYPES[firstTarget.typeKey];
                            const canBeSlowed = plantData && (plantData.shotLimit || plantData.productionLimit);
                            if (canBeSlowed && !firstTarget.isSlowed) { firstTarget.isSlowed = true; firstTarget.usageCount = plantData.shotLimit || plantData.productionLimit || firstTarget.usageCount; } 
                            else { firstTarget.takeDamage(this.attackDamage); } // USE INSTANCE PROP
                        } else if (this.typeKey === 'FIRE_MOWER' && firstTarget.isTargetable && firstTarget.health - this.attackDamage <= 0) { // MODIFIED: Check if it's a plant via isTargetable
                            if (!isTileBurnt(firstTarget.row, firstTarget.col)) burntTiles.push({ row: firstTarget.row, col: firstTarget.col, timer: 15 * FPS });
                            firstTarget.takeDamage(this.attackDamage); // USE INSTANCE PROP
                        } else { firstTarget.takeDamage(this.attackDamage); } // USE INSTANCE PROP
                        this.attackTimer = 0;
                    }
                } else { this.isAttacking = false; this.attackTimer = 0; }

                const moveDir = (typeData.behavior === 'back_mower' && this.direction === 1) ? 1 : -1;
                if (!this.isAttacking) { this.x += this.speed * moveDir; }
                if (this.x < -this.width) gameOver("The mowers reached your house!");
                if (this.x > CANVAS_WIDTH) this.health = 0;
            }
            performPushChain(row, col) {
                const pushPlantChain = (r, c) => {
                    if (c < 0) return;
                    const plant = gameGrid[r][c]; if (!plant) return;
                    const destCol = c - 1;
                    if (destCol < 0) { plant.remove(); return; } 
                    const blocking = gameGrid[r][destCol];
                    if (blocking) pushPlantChain(r, destCol);
                    if (gameGrid[r][destCol] == null) {
                        gameGrid[r][c] = null; plant.col = destCol; plant.x = destCol * TILE_SIZE; gameGrid[r][destCol] = plant;
                    } else { plant.remove(); }
                };
                pushPlantChain(row, col);
            }
            // --- MODIFIED: Added damageType and Shield Mower logic ---
            takeDamage(amount, damageType = 'normal') { 
                const typeData = ENEMY_TYPES[this.typeKey];
                if (typeData.zapResistance && (damageType === 'zap' || damageType === 'heavy_zap')) {
                    amount *= (1 - typeData.zapResistance);
                }

                this.health -= amount; 
                
				if (!this.isRaged && this.health <= this.maxHealth / 2) {
                    if (typeData.behavior === 'rage') {
                        this.isRaged = true;
                        this.speed *= 2;
                        this.attackDamage *= 2;
                    }
                }
				
                if (this.health <= 0) {
                    // NEW: Splitter Mower Logic
                    // --- SPLITTER: spawn 3 minis exactly once ---
					if (typeData.behavior === 'splitter' && !this._hasSplit) {
						this._hasSplit = true; // prevent re-spawning
						for (let i = 0; i < 3; i++) {
							const mini = new Enemy(this.row, 'MINI_MOWER');

							// place the mini at the splitter's death pose
							mini.x = this.x;
							mini.y = this.y;
							mini.targetY = mini.y;
							mini.row = this.row;
							mini.direction = this.direction;

							// tiny visual separation (optional — remove if you want exact overlap)
							mini.x += (i - 1) * Math.max(2, Math.floor(mini.width * 0.2));

							enemies.push(mini);
						}
					}

                    // END NEW

					if (this.isCarryingPlant && this.carriedPlantData) {
                        const dropRow = Math.max(0, Math.min(ROWS - 1, Math.round(this.y / TILE_SIZE)));
                        const dropCol = Math.max(0, Math.min(COLS - 1, Math.round(this.x / TILE_SIZE)));
                        
                        if (gameGrid[dropRow] && gameGrid[dropRow][dropCol] === null) {
                            // Tile is free, plant the plant
                            const newPlant = new Plant(dropRow, dropCol, this.carriedPlantData.typeKey);
                            plants.push(newPlant);
                            gameGrid[dropRow][dropCol] = newPlant;
                        } else {
                            // Tile is occupied, drop a seed
                            seeds++;
                            floatingIcons.push(new FloatingIcon(this.x, this.y, 'seed'));
                        }
                    }

                    if(this === currentBoss) currentBoss = null;
                    currency += ENEMY_TYPES[this.typeKey].moneyOnDrop || 0;
                    if (Math.random() < 0.10) {
                        seeds++;
                        floatingIcons.push(new FloatingIcon(this.x, this.y, 'seed'));
                    }
                    if (Math.random() < 0.03) {
                        boosts++;
                        floatingIcons.push(new FloatingIcon(this.x, this.y, 'boost'));
                    }
                    updateTopBar();
                }
            }
			
			explode(targetPlant) {
                const typeData = ENEMY_TYPES[this.typeKey];
                const explosionDamage = typeData.explosionDamage || 1500;
                const explosionCenterR = targetPlant.row;
                const explosionCenterC = targetPlant.col;
                const visualSize = TILE_SIZE * 1.5; // 3x3 visual
                
                // Add visual explosion
                explosions.push(new Explosion(targetPlant.x + targetPlant.width/2, targetPlant.y + targetPlant.height/2, visualSize, 0, 'fire'));

                for (let r_offset = -1; r_offset <= 1; r_offset++) {
                    for (let c_offset = -1; c_offset <= 1; c_offset++) {
                        const r = explosionCenterR + r_offset;
                        const c = explosionCenterC + c_offset;
                        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                            const plantOnTile = gameGrid[r][c];
                            if (plantOnTile) {
                                plantOnTile.takeDamage(explosionDamage);
                            }
                        }
                    }
                }
                
                this.health = 0; // Kills the kamikaze mower
            }
            draw() {

                }
                if (activeFilter) { // NEW
                    ctx.filter = activeFilter; // NEW
                }
                
                // --- BUG FIX: Flip image if hypnotized, leaving, or back_mower returning ---
                const isMovingRight = (this.isHypnotized && this.direction === 1) ||

                                      (this.isLeaving && this.direction === 1);

                if (isMovingRight) {

                    // --- BUG FIX: Added Tank/Skullcrusher attack animation logic for flipped mowers ---
                    let yOffset = 0; let rotation = 0;
                    if ((this.typeKey === 'TANK' || this.typeKey === 'SKULLCRUSHER' || this.typeKey === 'DESTROYER_TANK') && this.isAttacking) {
                        const attackInterval = ENEMY_TYPES[this.typeKey].attackInterval;
                        const attackCycle = (this.attackTimer / attackInterval);
                        if (attackCycle > 0.8) { yOffset = -15 * Math.sin((attackCycle - 0.8) / 0.2 * Math.PI); }
                        else if (attackCycle < 0.15) { rotation = 0.4 * Math.sin(attackCycle / 0.15 * Math.PI); }
                    }
                    // --- END FIX ---

                    ctx.save(); // Save 2 (for flip/transform)
                    ctx.translate(this.x + this.width, this.y); // Go to top-right
                    ctx.scale(-1, 1); // Flip horizontally

                    // Now we are in a flipped coordinate system, where (0,0) is the top-left of the image
                    // We need to translate to the center of the image, rotate, and draw
                    ctx.translate(this.width / 2, this.height / 2);
                    ctx.rotate(rotation);
                    drawImageOrFallback(ctx, this.image, -this.width / 2, -this.height / 2 + yOffset, this.width, this.height);
					
					if (this.isCarryingPlant && this.carriedPlantImage) {
                        drawImageOrFallback(ctx, this.carriedPlantImage, -this.width / 2 + (this.width*0.1), -this.height / 2 - (this.height*0.3), this.width * 0.8, this.height * 0.8);
                    }
                    
                    ctx.restore(); // restore from flip/transform
                    
                    ctx.filter = 'none'; // Reset filter for health bar
                    drawHealthBar(ctx, this.x, this.y, this.width, this.height, this.health, this.maxHealth);
                    
                    ctx.restore(); // Restore 1 (from alpha)
                    return; // exit draw early
                }
                
                let yOffset = 0; let rotation = 0;
                if ((this.typeKey === 'TANK' || this.typeKey === 'SKULLCRUSHER' || this.typeKey === 'DESTROYER_TANK') && this.isAttacking) {
                    const attackInterval = ENEMY_TYPES[this.typeKey].attackInterval;
                    const attackCycle = (this.attackTimer / attackInterval);
                    if (attackCycle > 0.8) { yOffset = -15 * Math.sin((attackCycle - 0.8) / 0.2 * Math.PI); }
                    else if (attackCycle < 0.15) { rotation = 0.4 * Math.sin(attackCycle / 0.15 * Math.PI); }
                }

                ctx.save(); // Save 2 (for transform)
                if (this.typeKey === 'PUSH_MOWER' && this.isPushing) {
                    const pulseAmount = Math.sin((this.pushCooldown || 0) * 0.2) * 0.06 + 1;
                    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                    ctx.scale(pulseAmount, pulseAmount);
                    drawImageOrFallback(ctx, this.image, -this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                    ctx.rotate(rotation);
                    drawImageOrFallback(ctx, this.image, -this.width / 2, -this.height / 2 + yOffset, this.width, this.height);
					
					if (this.isCarryingPlant && this.carriedPlantImage) {
                        drawImageOrFallback(ctx, this.carriedPlantImage, -this.width / 2 + (this.width*0.1), -this.height / 2 - (this.height*0.3), this.width * 0.8, this.height * 0.8);
                    }
                }
                ctx.restore(); // Restore 2 (from transform)

                ctx.filter = 'none'; // Reset filter for health bar
                drawHealthBar(ctx, this.x, this.y, this.width, this.height, this.health, this.maxHealth);
                
                ctx.restore(); // Restore 1 (from alpha)
            }
        }

        class Projectile {
            constructor(x, y, row, typeKey, direction, target = null) {
                const typeData = PROJECTILE_TYPES[typeKey];
                this.x = x; this.y = y; this.row = row; this.typeKey = typeKey;
                this.width = typeData.width; this.height = typeData.height; this.speed = typeData.speed; this.damage = typeData.damage; this.image = images[typeData.imageKey];
                this.direction = direction || 1;
                this.isOffscreen = false; this.hasHit = false;
                this.target = target;
            }
            update() {
                if(this.target) {
                    // Check if target is "alive"
                    let targetIsAlive = this.target.health > 0;
                    
                    // Special case for win-anim dummy target
                    if (this.target.isDummyTarget && this.target.health <= 0) {
                        targetIsAlive = false;
                    }
                    
                    if (!targetIsAlive) {
                        // Target is dead or gone
                        this.hasHit = true; // Mark as "hit" to be cleaned up
                        const typeData = PROJECTILE_TYPES[this.typeKey];
                        
                        // Explode on target death if explosive
                        if (typeData.isExplosive) {
                            // --- MODIFIED: Pass damageType ---
                            let damageType = (this.typeKey === 'HEAVY_ZAP_ATTACK') ? 'heavy_zap' : 'normal';
                            explosions.push(new Explosion(this.x, this.y, typeData.explosionRadius, typeData.damage, typeData.explosionColor || 'orange', damageType));
                            // --- END MODIFIED ---
                        }

                        this.isOffscreen = true; // Still mark for removal
                        return;
                    } 
                    
                    // --- Homing Logic ---
                    const targetX = this.target.x + (this.target.width || 0) / 2;
                    const targetY = this.target.y + (this.target.height || 0) / 2;
                    const angle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                    
                    // --- MODIFIED: Hit Logic for damage types and dummy targets ---
                    if (rectsOverlap(this, this.target)) {
                        this.hasHit = true;
                        const typeData = PROJECTILE_TYPES[this.typeKey]; // Get type data
                        
                        if (this.typeKey === 'HEAVY_ZAP_BOOST' && this.target.isBoosted !== undefined) {
                            // It's a boost orb hitting a plant
                            applyBoostToPlant(this.target);
                        } else if (this.target.isDummyTarget) {
                            this.target.health = 0; // "kill" dummy
                            if (typeData.isExplosive) {
                                // Visual-only explosion
                                explosions.push(new Explosion(this.target.x + this.target.width / 2, this.target.y + this.target.height / 2, typeData.explosionRadius, 0, typeData.explosionColor || 'orange'));
                            }
                        } else if (this.target.takeDamage) {
                            // It's a normal projectile hitting an enemy
                            let damageType = 'normal';
                            if (this.typeKey === 'ZAP') damageType = 'zap';
                            if (this.typeKey === 'HEAVY_ZAP_ATTACK') damageType = 'heavy_zap';

                            if (typeData.isExplosive) {
                                explosions.push(new Explosion(this.target.x + this.target.width / 2, this.target.y + this.target.height / 2, typeData.explosionRadius, typeData.damage, typeData.explosionColor || 'orange', damageType));
                            } else {
                                this.target.takeDamage(this.damage, damageType);
                            }
                        }
                    }
                    // --- END MODIFIED ---
                    
                } else {
                    // Non-homing projectile
                    this.x += this.speed * this.direction;
                }
                
                if ((this.direction === 1 && this.x > CANVAS_WIDTH) || (this.direction === -1 && this.x < -this.width)) this.isOffscreen = true;
            }
            draw() {
                ctx.save();
                if (this.alpha !== undefined) ctx.globalAlpha *= this.alpha;
                drawImageOrFallback(ctx, this.image, this.x, this.y, this.width, this.height);
                ctx.restore();
            }
        }

        // --- MODIFIED: Added damageType ---
        class Explosion {
            constructor(x, y, radius, damage, color = 'orange', damageType = 'normal') {
                this.x = x; this.y = y; this.maxRadius = radius; this.damage = damage;
                this.duration = 30; this.timer = this.duration; this.isAlive = true;
                this.color = color;
                this.damageType = damageType; // Store it
                if(this.damage > 0) this.applyRadiusDamage();
            }
            applyRadiusDamage() {
                enemies.forEach(enemy => {
                    const distance = Math.sqrt(Math.pow(this.x - (enemy.x + enemy.width / 2), 2) + Math.pow(this.y - (enemy.y + enemy.height / 2), 2));
                    // --- MODIFIED: Pass damageType ---
                    if (distance <= this.maxRadius) enemy.takeDamage(this.damage, this.damageType);
                });
            }
            // --- END MODIFIED ---
            update() { this.timer--; if (this.timer <= 0) this.isAlive = false; }
            draw() {
                const progress = 1 - (this.timer / this.duration);
                const currentRadius = this.maxRadius * progress; const opacity = 1 - progress;
                
                let fill = `rgba(255, 165, 0, ${opacity * 0.8})`;
                let stroke = `rgba(255, 69, 0, ${opacity})`;
                
                if (this.color === 'fire') {
                    fill = `rgba(255, 100, 0, ${opacity * 0.8})`;
                    stroke = `rgba(255, 200, 0, ${opacity})`;
                } else if (this.color === 'zap') {
                    fill = `rgba(0, 255, 255, ${opacity * 0.7})`;
                    stroke = `rgba(255, 255, 255, ${opacity})`;
                }

                ctx.beginPath(); ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = fill; ctx.fill();
                ctx.strokeStyle = stroke; ctx.lineWidth = 5; ctx.stroke();
            }
        }
        
        // --- NEW: Beam class for Laser Lilac ---
        class Beam {
            constructor(x, y, row, duration, damage, plant) {
                this.x = x; this.y = y; this.row = row;
                this.duration = duration;
                this.timer = duration;
                this.damage = damage;
                this.plant = plant; // To check for boost
                this.isAlive = true;
                this.width = CANVAS_WIDTH - x;
                this.height = TILE_SIZE * 0.2;
            }
            update() {
                this.timer--;
                if (this.timer <= 0) this.isAlive = false;

                let currentDamage = this.damage;
                if (this.plant && this.plant.isBoosted) currentDamage *= 5;
                
                // Find all enemies in the row
                const enemiesInRow = enemies.filter(e =>
                    !e.isHypnotized &&
                    Math.max(0, Math.min(ROWS - 1, Math.round(e.y / TILE_SIZE))) === this.row
                );

                let beamBlocked = false;
                
                // Sort enemies by X to find shield mowers first
                enemiesInRow.sort((a, b) => a.x - b.x);

                for (const enemy of enemiesInRow) {
                    if (beamBlocked) break; // Beam was stopped

                    const beamRect = { x: this.x, y: this.y, width: this.width, height: this.height };
                    if (rectsOverlap(beamRect, enemy)) {
                        
                        // Shield Mower logic
                        if (enemy.typeKey === 'SHIELD_MOWER') {
                            beamBlocked = true;
                            this.width = enemy.x - this.x; // Visually stop the beam
                            // Shield mower takes no damage from beam
                        } else {
                            // Damage enemy (damage is per-frame, so it's low)
                            enemy.takeDamage(currentDamage);
                        }
                    }
                }
            }
            draw() {
                if (!this.isAlive) return;
                const progress = this.timer / this.duration;
                // Use a sine wave for a quick pulse effect
                const alpha = Math.sin(progress * Math.PI) * 0.7; // Fades in and out
                
                let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.width, this.y);
                grad.addColorStop(0, `rgba(255, 0, 255, ${alpha})`);
                grad.addColorStop(0.8, `rgba(255, 0, 255, ${alpha * 0.5})`);
                grad.addColorStop(1, `rgba(255, 0, 255, 0)`);
                
                ctx.fillStyle = grad;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Core
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 1.2})`;
                ctx.fillRect(this.x, this.y + this.height * 0.3, this.width, this.height * 0.4);
            }
        }

        let fxCanvas = null, fxCtxRef = null;
        function getFxCtx() {
            if (!fxCanvas) {
                fxCanvas = document.createElement('canvas'); fxCanvas.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:120';
                document.body.appendChild(fxCanvas); fxCtxRef = fxCanvas.getContext('2d');
            }
            if (fxCanvas.width !== innerWidth || fxCanvas.height !== innerHeight) { fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; }
            return fxCtxRef;
        }
        class FloatingIcon {
            constructor(startX, startY, type) {
                this.x = startX; this.y = startY;
                this.alpha = 1; this.isAlive = true;
                this.type = type;
                if(type === 'currency') {
                    this.targetElement = currencyDisplay;
                    this.text = '$';
                } else if(type === 'seed') {
                    this.targetElement = seedsDisplay;
                    this.image = images.icon_seed;
                } else {
                    this.targetElement = boostsDisplay;
                    this.image = images.icon_boost;
                }
            }
            update() {
                const rect = (this._tr && this._trF === _frame) ? this._tr : (this._trF = _frame, this._tr = this.targetElement.getBoundingClientRect());
                const gameRect = canvasRect();
                const sx = CANVAS_WIDTH / gameRect.width, sy = CANVAS_HEIGHT / gameRect.height;
                const targetX = ((rect.left - gameRect.left) + rect.width / 2) * sx;
                const targetY = ((rect.top - gameRect.top) + rect.height / 2) * sy;
                
                this.x += (targetX - this.x) * 0.08;
                this.y += (targetY - this.y) * 0.08;
                
                if (Math.abs(targetX - this.x) < 10 && Math.abs(targetY - this.y) < 10) {
                    this.isAlive = false;
                }
            }
            draw() {
                const r = canvasRect(); const k = r.width / CANVAS_WIDTH;
                const fx = getFxCtx(); fx.save();
                fx.globalAlpha = this.alpha;
                fx.translate(r.left + this.x * k, r.top + this.y * k); fx.scale(k, k);
                if(this.type === 'currency') {
                    fx.font = 'bold 30px Arial';
                    fx.fillStyle = '#ffd700'; fx.strokeStyle = '#000'; fx.lineWidth = 3;
                    fx.strokeText(this.text, 0, 0); fx.fillText(this.text, 0, 0);
                } else {
                    drawImageOrFallback(fx, this.image, 0, 0, 30, 30);
                }
                fx.restore();
            }
        }

        // Fit the canvas inside the stage: always centered, always fully visible, any screen size
        function fitGame() {
            const stage = document.getElementById('stage');
            const wrap = document.getElementById('game-wrapper');
            const pad = 8, w = stage.clientWidth - pad * 2, h = stage.clientHeight - pad * 2;
            if (w <= 0 || h <= 0) return;
            const s = Math.min(w / CANVAS_WIDTH, h / CANVAS_HEIGHT);
            wrap.style.width = Math.floor(CANVAS_WIDTH * s) + 'px';
            wrap.style.height = Math.floor(CANVAS_HEIGHT * s) + 'px';
            gameOverlay.style.fontSize = Math.max(16, Math.floor(CANVAS_WIDTH * s / 18)) + 'px';
        }

        function addPlantCard(typeKey, premium) {
            const plant = PLANT_TYPES[typeKey];
            const card = document.createElement('div');
            card.className = 'plant-card' + (premium ? ' premium' : ''); card.dataset.type = typeKey; card.title = plant.name;
            card.innerHTML = `<img src="${IMAGE_SOURCES[plant.imageKey] || ''}" alt="" onerror="this.style.visibility='hidden'"><span class="name">${plant.name}</span><span class="cost">$${plant.cost}</span>`;
