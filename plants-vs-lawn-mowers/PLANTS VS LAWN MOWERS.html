        function setupUI() {
            updateTopBar();
            waveDisplay.textContent = `Wave: ${currentWave}/${WAVE_DATA.length}`;
            plantMenu.innerHTML = '';
            Object.keys(PLANT_TYPES).forEach(k => addPlantCard(k));
        }

        function startGame() {
            startScreen.style.display = 'none'; gameContainer.classList.add('on');
            gameStarted = true; gameRunning = true; fitGame(); gameLoop();
        }

        // === GAME LOOP & STATE MANAGEMENT ===
        let _lastT = 0, _acc = 0, _frame = 0, _rc = null, _rcF = -1, _dtSteps = 1;
        const STEP_MS = 1000 / 60;
        function resetClock() { _lastT = 0; _acc = 0; }
        document.addEventListener('visibilitychange', resetClock);
        window.addEventListener('focus', resetClock);
        function canvasRect() { if (_rcF !== _frame) { _rc = canvas.getBoundingClientRect(); _rcF = _frame; } return _rc; }
        function gameLoop(ts) {
            if (!gameRunning) { if (fxCanvas) fxCtxRef.clearRect(0, 0, fxCanvas.width, fxCanvas.height); return; }
            // lock to 60 updates/sec: stops high-refresh screens from running the game too fast and burning CPU/GPU
            let steps = 1;
            if (ts) {
                // fixed 60Hz logic step driven by real elapsed time (accumulator); render once per pass
                const dt = _lastT ? Math.min(250, Math.max(0, ts - _lastT)) : 0; _lastT = ts;
                if (isPaused) _acc = 0; else _acc += dt;
                if (isPaused) steps = 1;
                else {
                    steps = Math.floor((_acc + 1.2) / STEP_MS);
                    if (steps < 1) { requestAnimationFrame(gameLoop); return; }
                    _acc = Math.max(0, _acc - steps * STEP_MS);
                    if (steps > 6) { steps = 6; _acc = 0; } // drop backlog instead of spiralling
                }
            } else { resetClock(); }
            _dtSteps = isPaused ? 0 : steps;
            _frame++;
            
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            getFxCtx().clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            drawLawn();
            
            if (isGameOverAnimation) {
                runGameOverAnimation();
            } else if (isWaveClearAnimation) { // NEW
                runWaveClearAnimation();
            } else if (!isPaused) {
                for (let i = 0; i < gameSpeed * steps; i++) {
                    // Don't run logic if we paused during a 2x speed frame
                    if (isPaused || isGameOverAnimation) break;
                    updateGameObjects(); 
                    handleCollisions(); 
                    cleanupArrays(); 
                    manageWaves();
                }
            }

            plants.forEach(p => p.draw()); enemies.forEach(e => e.draw()); 
            projectiles.forEach(p => p.draw());
            beams.forEach(b => b.draw()); // NEW: Draw beams
            explosions.forEach(e => e.draw());
            floatingIcons.forEach(i => i.draw());
            if (isFoggy) {
                const fogFade = isGameOverAnimation
                    ? (gameOverState === 'FOG_FADING' ? Math.max(0, 1 - gameOverAnimationTimer / FOG_FADE_FRAMES) : 0)
                    : 1;
                if (fogFade > 0) drawFog(0.6 * fogFade);
            }
            if (isGameOverAnimation && gameOverState === 'PLANTS_FADING') drawPlagueAtmosphere();
            
            // NEW: Draw boss health bar
            if (currentBoss) {
                drawBossHealthBar();
            }
            
            if (isGameOverAnimation && gameOverState === 'FOG_FADING') {
                const fogAlpha = Math.max(0, 1 - gameOverAnimationTimer / FOG_FADE_FRAMES);
                if (fogAlpha > 0) {
                    const g = ctx.createRadialGradient(CANVAS_WIDTH * .42, CANVAS_HEIGHT * .48, 10, CANVAS_WIDTH * .42, CANVAS_HEIGHT * .48, CANVAS_WIDTH * .72);
                    g.addColorStop(0, `rgba(60,140,20,${.3 * fogAlpha})`);
                    g.addColorStop(1, `rgba(20,50,10,${.16 * fogAlpha})`);
                    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT); ctx.restore();
                }
            }
            drawOverlay();
            requestAnimationFrame(gameLoop);
        }

        // A low, sickly veil follows the diagonal dust front, with a dark vignette and pulsing edge.
        function drawPlagueAtmosphere() {
            const total = Math.max(1, gameOverPlantCount);
            const sweep = Math.max(0, Math.min(1, 1 - plantsToFade.length / total));
            const pulse = 0.5 + 0.5 * Math.sin(gameOverAnimationTimer * 0.105);
            const edge = Math.max(0.04, Math.min(0.96, sweep));
            const before = Math.max(0, edge - 0.13);
            const after = Math.min(1, edge + 0.12);

            ctx.save();
            ctx.fillStyle = `rgba(2, 8, 5, ${0.09 + pulse * 0.035})`;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const creeping = ctx.createLinearGradient(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            creeping.addColorStop(0, 'rgba(0, 0, 0, 0.02)');
            creeping.addColorStop(before, `rgba(3, 10, 6, ${0.08 + pulse * 0.025})`);
            creeping.addColorStop(edge, `rgba(5, 23, 10, ${0.27 + pulse * 0.07})`);
            creeping.addColorStop(after, `rgba(2, 9, 5, ${0.10 + pulse * 0.025})`);
            creeping.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
            ctx.fillStyle = creeping;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const vignette = ctx.createRadialGradient(
                CANVAS_WIDTH * 0.5, CANVAS_HEIGHT * 0.48, CANVAS_HEIGHT * 0.12,
                CANVAS_WIDTH * 0.5, CANVAS_HEIGHT * 0.48, CANVAS_WIDTH * 0.72
            );
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, `rgba(0, 4, 2, ${0.23 + pulse * 0.055})`);
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.restore();
        }

        function sendEnemiesAway() {
            enemies.forEach(e => {
                e.isLeaving = true;
                e.isAttacking = false;
                e.attackTimer = 0;
                e.rowChangeTimer = 0;
                e.targetY = e.y;
                e.direction = 1;
                e.speed = Math.max(Math.abs(ENEMY_TYPES[e.typeKey].speed || 0.3), 1.25);
                e.isStealthed = false;
                e.isHypnotized = false;
            });
        }

        function manageWaves() {
            if (!waveInProgress && !isWaveClearAnimation) { // NEW: Don't count down during anim
                waveTimer--;
                if (waveTimer <= 0) startNextWave();
            } else if (waveInProgress) { // Only spawn if wave is in progress
                spawnTimer++;
                if (spawnTimer >= 1.5 * FPS && enemiesToSpawn.length > 0) { spawnEnemyFromQueue(); spawnTimer = 0; }
                
                // MODIFIED: Check for active mowers (not hypnotized)
                const activeMowers = enemies.filter(e => !e.isHypnotized).length;
                if (enemiesToSpawn.length === 0 && activeMowers === 0) { // Wave just ended
                    waveInProgress = false; 
                    
                    if (currentWave >= WAVE_DATA.length) {
                        // We just beat the final wave, start celebration!
                        startWaveClearAnimation(); 
                    } else {
                        // Not the final wave, just move on
                        waveTimer = 4 * FPS;
                        // Clear out any remaining hypnotized mowers
                        enemies.forEach(e => {
                            if(e.isHypnotized) e.health = 0; 
                        });
                    }
                }
            }
        }

        // NEW: Wave Clear Animation
        function startWaveClearAnimation() {
            if (isWaveClearAnimation) return; 
            isWaveClearAnimation = true;
            projectiles = []; beams = [];
            waveClearTimer = 0;
            waveClearPhase = 'WALLS_JUMP1';
            
            // NEW: Calculate score before plants are removed
            if (currentWave >= WAVE_DATA.length) { // Only calc on final wave
                finalScore = currency;
                plants.forEach(p => { finalScore += PLANT_TYPES[p.typeKey].cost * 2; });
            }
            
            // Give each plant animation properties
            plants.forEach(p => {
                p.anim = {
                    state: 'IDLE',
                    timer: 0,
                    origY: p.y,
                    velY: 0
                };
            });
            // Stagger wall jumps
            plants.filter(p => p.behavior === 'WALL' || p.isHypnotizer || p.behavior === 'DIVERTER').forEach((p, index) => { // Added Diverter
                p.anim.state = 'START_JUMP1';
                p.anim.timer = -index * 5; // Stagger by 5 frames
            });
        }

        // NEW: Wave Clear Animation Runner
        function runWaveClearAnimation() {
            waveClearTimer++;
            let allAnimsDone = true;
            // Added Diverter
            const wallPlants = plants.filter(p => p.behavior === 'WALL' || p.isHypnotizer || p.behavior === 'DIVERTER');
            const shooterPlants = plants.filter(p => p.behavior === 'SHOOTER');
            const zapperPlants = plants.filter(p => p.behavior === 'ZAPPER');
            const heavyZapperPlants = plants.filter(p => p.behavior === 'HEAVY_ZAPPER'); // NEW
            const beamPlants = plants.filter(p => p.behavior === 'BEAM'); // NEW
            const spikePlants = plants.filter(p => p.behavior === 'SPIKE'); // NEW
            const producerPlants = plants.filter(p => p.behavior === 'PRODUCER'); // NEW


            if (waveClearPhase === 'WALLS_JUMP1') {
                allAnimsDone = true;
                wallPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_JUMP1' && p.anim.timer >= 0) {
                        p.anim.state = 'JUMPING1';
                        p.anim.velY = -5; // Initial jump velocity
                    }
                    if (p.anim.state === 'JUMPING1') {
                        allAnimsDone = false;
                        p.y += p.anim.velY;
                        p.anim.velY += 0.5; // Gravity
                        if (p.y >= p.anim.origY) {
                            p.y = p.anim.origY;
                            p.anim.state = 'START_JUMP2';
                            p.anim.timer = 0;
                        }
                    }
                });
                if (allAnimsDone && wallPlants.length === 0) allAnimsDone = true; // Skip if no walls
                if (allAnimsDone) {
                    waveClearPhase = 'WALLS_JUMP2';
                    wallPlants.forEach((p, index) => { p.anim.timer = -index * 5; }); // Stagger
                }
            } 
            else if (waveClearPhase === 'WALLS_JUMP2') {
                allAnimsDone = true;
                wallPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_JUMP2' && p.anim.timer >= 0) {
                        p.anim.state = 'JUMPING2';
                        p.anim.velY = -10; // 2x higher jump
                    }
                    if (p.anim.state === 'JUMPING2') {
                        allAnimsDone = false;
                        p.y += p.anim.velY;
                        p.anim.velY += 0.5; // Gravity
                        if (p.y >= p.anim.origY) {
                            p.y = p.anim.origY;
                            p.anim.state = 'START_JUMP3';
                            p.anim.timer = 0;
                        }
                    }
                });
                if (allAnimsDone && wallPlants.length === 0) allAnimsDone = true; // Skip if no walls
                if (allAnimsDone) {
                    waveClearPhase = 'WALLS_JUMP3_EXIT';
                    wallPlants.forEach((p, index) => { p.anim.timer = -index * 5; }); // Stagger
                }
            } 
            else if (waveClearPhase === 'WALLS_JUMP3_EXIT') {
                allAnimsDone = true;
                wallPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_JUMP3' && p.anim.timer >= 0) {
                        p.anim.state = 'JUMPING3_EXIT';
                        p.anim.velY = -10; // Same high jump
                    }
                    if (p.anim.state === 'JUMPING3_EXIT') {
                        allAnimsDone = false;
                        p.y += p.anim.velY;
                        p.anim.velY += 0.5; // Gravity
                        p.x += 4; // Move right
                        if (p.x > CANVAS_WIDTH) {
                            p.anim.state = 'DONE';
                            p.remove(true); // MODIFIED: Pass flag
                        }
                    }
                    if (p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                 });
                if (allAnimsDone && wallPlants.length === 0) allAnimsDone = true; // Skip if no walls
                if (allAnimsDone) {
                    waveClearPhase = 'SHOOTERS_RAPIDFIRE';
                    shooterPlants.forEach((p, index) => {
                         p.anim.state = 'START_RAPIDFIRE';
                         p.anim.timer = -index * 5; // Stagger
                    });
                }
            }
            else if (waveClearPhase === 'SHOOTERS_RAPIDFIRE') {
                allAnimsDone = true;
                shooterPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_RAPIDFIRE' && p.anim.timer >= 0) {
                        p.anim.state = 'RAPIDFIRE';
                        p.anim.timer = 0; // Reset timer
                    }
                    if (p.anim.state === 'RAPIDFIRE') {
                        allAnimsDone = false;
                        let interval = (PLANT_TYPES[p.typeKey].shootInterval || 180) / 10;
                        if (p.anim.timer % Math.max(2, Math.floor(interval)) === 0) {
                            p.shoot();
                        }
                        if (p.anim.timer > 120) { // Fire for 2 seconds
                            p.anim.state = 'EXPLODE';
                            explosions.push(new Explosion(p.x + p.width/2, p.y + p.height/2, TILE_SIZE * 1.5, 0, 'fire')); // MODIFIED: Color
                            explosions.push(new Explosion(p.x + p.width/2, p.y + p.height/2, TILE_SIZE * 1, 0, 'orange')); // MODIFIED: Color
                            p.remove(true); // MODIFIED: Pass flag
                        }
                    }
                    if (p.anim.state !== 'EXPLODE' && p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                });
                if (allAnimsDone && shooterPlants.length === 0) allAnimsDone = true; // Skip
                if (allAnimsDone) {
                    waveClearPhase = 'BEAM_PLANTS_FIRE'; // NEW: Transition to Lilacs
                    beamPlants.forEach((p, index) => {
                         p.anim.state = 'START_FIRE';
                         p.anim.timer = -index * 5; // Stagger
                    });
                }
            }
            // --- NEW: Laser Lilac Animation Phase ---
            else if (waveClearPhase === 'BEAM_PLANTS_FIRE') {
                 allAnimsDone = true;
                 beamPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_FIRE' && p.anim.timer >= 0) {
                        p.anim.state = 'FIRING';
                        p.anim.timer = 0;
                    }
                    if (p.anim.state === 'FIRING') {
                        allAnimsDone = false;
                        let interval = (PLANT_TYPES[p.typeKey].shootInterval || 300) / 10;
                        
                        if (p.anim.timer % Math.max(5, Math.floor(interval)) === 0) {
                            const pY_center = p.y + p.height / 2;
                            beams.push(new Beam(p.x + p.width - 10, pY_center - (TILE_SIZE * 0.1), p.row, PLANT_TYPES[p.typeKey].beamDuration, 0, p)); // No damage
                        }

                         if (p.anim.timer > 120) { // Fire for 2 seconds
                            p.anim.state = 'EXPLODE';
                            explosions.push(new Explosion(p.x + p.width/2, p.y + p.height/2, TILE_SIZE * 1.5, 0, 'zap'));
                            p.remove(true);
                        }
                    }
                    if (p.anim.state !== 'EXPLODE' && p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                 });
                 if (allAnimsDone && beamPlants.length === 0) allAnimsDone = true; // Skip
                 if (allAnimsDone) {
                    waveClearPhase = 'ZAPPERS_ZAP';
                    zapperPlants.forEach((p, index) => {
                         p.anim.state = 'START_ZAP';
                         p.anim.timer = -index * 5; // Stagger
                    });
                }
            }
            // --- END NEW ---
            else if (waveClearPhase === 'ZAPPERS_ZAP') {
                 allAnimsDone = true;
                 zapperPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_ZAP' && p.anim.timer >= 0) {
                        p.anim.state = 'ZAPPING';
                        p.anim.timer = 0;
                    }
                    if (p.anim.state === 'ZAPPING') {
                        allAnimsDone = false;
                        let interval = (PLANT_TYPES[p.typeKey].shootInterval || 300) / 10;
                        
                        if (p.anim.timer % Math.max(2, Math.floor(interval)) === 0) {
                            projectiles.push(new Projectile(p.x + p.width / 2, p.y + p.height / 2 - 10, p.row, 'ZAP', 1, null));
                        }

                         if (p.anim.timer > 120) { // Zap for 2 seconds
                            p.anim.state = 'EXPLODE';
                            explosions.push(new Explosion(p.x + p.width/2, p.y + p.height/2, TILE_SIZE * 1.5, 0, 'zap'));
                            if (!isTileBurnt(p.row, p.col)) {
                                burntTiles.push({ row: p.row, col: p.col, timer: 15 * FPS });
                            }
                            p.remove(true);
                        }
                    }
                    if (p.anim.state !== 'EXPLODE' && p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                 });
                 if (allAnimsDone && zapperPlants.length === 0) allAnimsDone = true; // Skip
                 if (allAnimsDone) {
                    // --- MODIFIED: Transition to Heavy Zappers ---
                    waveClearPhase = 'HEAVY_ZAPPERS_FIRE';
                    heavyZapperPlants.forEach((p, index) => {
                         p.anim.state = 'START_FIRE';
                         p.anim.timer = -index * 5; // Stagger
                         p.ammo = 3; // Give them 3 ammo for the show
                    });
                    // --- End MODIFIED ---
                 }
            }
            // --- NEW: Crisis Carrot Animation Phase ---
            else if (waveClearPhase === 'HEAVY_ZAPPERS_FIRE') {
                allAnimsDone = true;
                heavyZapperPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_FIRE' && p.anim.timer >= 0) {
                        p.anim.state = 'FIRING';
                        p.anim.timer = 0;
                    }
                    if (p.anim.state === 'FIRING') {
                        allAnimsDone = false;
                        
                        if (p.ammo > 0 && p.anim.timer % 30 === 0) { // Fire one every 0.5s
                            p.ammo--;
                            // Create a dummy target off-screen
                            const dummyTarget = {
                                x: CANVAS_WIDTH + 100,
                                y: p.y,
                                width: TILE_SIZE, height: TILE_SIZE,
                                isDummyTarget: true,
                                health: 1 // Give it 1 health so projectile tracks it
                            };
                            projectiles.push(new Projectile(p.x + p.width / 2, p.y + p.height / 2, p.row, 'HEAVY_ZAP_ATTACK', 1, dummyTarget));
                        }
                        
                        if (p.ammo === 0 && p.anim.timer > 100) { // After firing all 3
                            p.anim.state = 'EXPLODE';
                            // Use self-destruct animation from draw logic
                            p.anim.state = 'SELF_DESTRUCT';
                            p.anim.timer = 0; 
                        }
                    }
                    
                    // This state is handled by the draw() function
                    if (p.anim.state === 'SELF_DESTRUCT') {
                        allAnimsDone = false; // Wait for it to finish
                        if (p.removed) p.anim.state = 'DONE';
                    }
                    
                    if (p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                });
                if (allAnimsDone && heavyZapperPlants.length === 0) allAnimsDone = true; // Skip
                if (allAnimsDone) {
                    waveClearPhase = 'SPIKES_TRANSFORM';
                    spikePlants.forEach((p, index) => {
                         p.anim.state = 'START_TRANSFORM';
                         p.anim.timer = -index * 5; // Stagger
                    });
                }
            }
            // --- END NEW ---
            else if (waveClearPhase === 'SPIKES_TRANSFORM') {
                allAnimsDone = true;
                spikePlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_TRANSFORM' && p.anim.timer >= 0) {
                        p.anim.state = 'TRANSFORMING';
                        p.anim.timer = 0;
                    }
                    if (p.anim.state === 'TRANSFORMING') {
                        allAnimsDone = false;
                        // Turn into a mower
                        p.image = images.enemy_classic;
                        
                        if (p.anim.timer > 45) { // Wait ~0.75s
                            p.anim.state = 'EXPLODE';
                            explosions.push(new Explosion(p.x + p.width/2, p.y + p.height/2, TILE_SIZE * 1.5, 0, 'fire'));
                            p.remove(true);
                        }
                    }
                    if (p.anim.state !== 'EXPLODE' && p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                });
                if (allAnimsDone && spikePlants.length === 0) allAnimsDone = true; // Skip
                if (allAnimsDone) {
                    waveClearPhase = 'PRODUCERS_GLOW';
                    producerPlants.forEach((p, index) => {
                         p.anim.state = 'START_GLOW';
                         p.anim.timer = -index * 5; // Stagger
                         p.anim.scale = 1.0;
                         p.anim.glow = false;
                    });
                }
            }
            else if (waveClearPhase === 'PRODUCERS_GLOW') {
                allAnimsDone = true;
                producerPlants.forEach(p => {
                    p.anim.timer++;
                    if (p.anim.state === 'START_GLOW' && p.anim.timer >= 0) {
                        p.anim.state = 'GLOWING';
                        p.anim.timer = 0;
                        p.anim.glow = true; // Use glow from draw function
                    }
                    if (p.anim.state === 'GLOWING') {
                        allAnimsDone = false;
                        if (p.anim.timer > 30) {
                            p.anim.state = 'EXPAND1';
                            p.anim.timer = 0;
                        }
                    }
                    else if (p.anim.state === 'EXPAND1') {
                        allAnimsDone = false;
                        p.anim.scale += 0.05; // Expand
                        if (p.anim.scale >= 1.5) {
                            p.anim.state = 'EXPAND2';
                            p.anim.timer = 0;
                            p.anim.scale = 1.0; // Reset for next expand
                        }
                    }
                    else if (p.anim.state === 'EXPAND2') {
                        allAnimsDone = false;
                        p.anim.scale += 0.1; // Expand faster
                        if (p.anim.scale >= 2.0) {
                            p.anim.state = 'EXPLODE';
                            p.anim.glow = false;
                            explosions.push(new Explosion(p.x + p.width/2, p.y + p.height/2, TILE_SIZE * 2, 0, 'orange'));
                            p.remove(true);
                        }
                    }
                    
                    if (p.anim.state !== 'EXPLODE' && p.anim.state !== 'DONE' && !p.removed) allAnimsDone = false;
                });
                if (allAnimsDone && producerPlants.length === 0) allAnimsDone = true; // Skip
                if (allAnimsDone) {
                    waveClearPhase = 'FINISH';
                    waveClearTimer = 0;
                }
            }
            else if (waveClearPhase === 'FINISH') {
                waveClearTimer++;
                if (waveClearTimer > 60) { // Wait 1 second
                    isWaveClearAnimation = false;
                    waveClearPhase = 'IDLE';
                    
                    if (currentWave >= WAVE_DATA.length) {
                        gameOver("YOU WIN!");
                    } else {
                        waveTimer = 4 * FPS; // Start timer for next wave
                    }
                }
            }
            
            // Update projectiles, beams, and explosions during animation
            projectiles.forEach(p => p.update()); 
            beams.forEach(b => b.update());
            explosions.forEach(e => e.update());
            cleanupArrays(); // Clean up projectiles/explosions/beams
        }


        function startNextWave() {
            if (currentWave >= WAVE_DATA.length) return;
            waveInProgress = true; enemiesToSpawn = []; currentWave++;
            const wave = WAVE_DATA[currentWave - 1];
			isFoggy = wave.isFoggy || false;
            for (const typeKey in wave.mowerTypes) { for (let i = 0; i < wave.mowerTypes[typeKey]; i++) enemiesToSpawn.push(typeKey); }
            enemiesToSpawn.sort(() => Math.random() - 0.5);
            
            // NEW: Ensure boss always spawns last
            const bossIndex = enemiesToSpawn.indexOf('DESTROYER_TANK');
            if (bossIndex > -1) {
                const boss = enemiesToSpawn.splice(bossIndex, 1)[0];
                enemiesToSpawn.push(boss);
            }

            waveDisplay.textContent = `Wave: ${currentWave}/${WAVE_DATA.length}`;

        function spawnEnemyFromQueue() {
            if (enemiesToSpawn.length === 0) return;
            const newEnemy = new Enemy(Math.floor(Math.random() * ROWS), enemiesToSpawn.shift());
            
            // Apply weaken hack if active
            if (hacks.weakenMowers) {
                newEnemy.maxHealth = newEnemy.maxHealth * 0.5;
                newEnemy.health = newEnemy.health * 0.5;
            }
            
            enemies.push(newEnemy);
        }

        function updateGameObjects() {
            const enemiesByRow = {}, plantsByRow = {};
            for (let r = 0; r < ROWS; r++) { enemiesByRow[r] = []; plantsByRow[r] = []; }
            enemies.forEach(e => {
                const currentVisualRow = Math.max(0, Math.min(ROWS - 1, Math.round(e.y / TILE_SIZE)));
                if (!enemiesByRow[currentVisualRow]) enemiesByRow[currentVisualRow] = [];
                enemiesByRow[currentVisualRow].push(e);
            });
            plants.forEach(p => {
                let enemiesForThisPlant = enemiesByRow[p.row] || [];
                // NEW: Filter out stealthed enemies for shooters
                if (p.behavior === 'SHOOTER' || p.behavior === 'BEAM') { // Added BEAM
                    enemiesForThisPlant = enemiesForThisPlant.filter(e => !(e.typeKey === 'STEALTH' && e.isStealthed));
                }
                p.update(enemiesForThisPlant); 
            });
            plants.forEach(p => { if (!p.removed) plantsByRow[p.row].push(p); });
            projectiles.forEach(p => p.update()); 
            beams.forEach(b => b.update()); // NEW: Update beams
            plants.forEach(p => {
                // p.update(enemiesByRow[p.row] || []); // Already called above
                if (isTileLava(p.row, p.col)) {
                    p.takeDamage(0.3); // Damage per frame from lava
                }
            });
            enemies.forEach(e => e.update(plantsByRow[e.row] || [], enemies)); // NEW: Pass allEnemies
            explosions.forEach(e => e.update());
			enemies.forEach(enemy => {
                if (enemy.health > 0 && enemy.health <= 150) {
                    // Check base health too, to avoid bosses
                    const baseHealth = ENEMY_TYPES[enemy.typeKey].health;
                    if (baseHealth <= 150) { 
                        const c = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
                        const r = Math.max(0, Math.min(ROWS - 1, Math.round(enemy.y / TILE_SIZE)));
                        if (isTileWater(r, c)) {
                            enemy.health = 0; // Sinks
                            // Add a splash effect (using 'zap' for a blue-ish color)
                            explosions.push(new Explosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, TILE_SIZE * 0.5, 0, 'zap'));
                        }
                    }
                }
            });
            burntTiles.forEach(tile => tile.timer--);
            lavaTiles.forEach(tile => tile.timer--);
			waterPatches.forEach(patch => patch.timer--);
            floatingIcons.forEach(i => i.update());
        }

        function handleCollisions() {
            projectiles.forEach(p => {
                if(p.hasHit) return;
                
                if(p.target) {
                    // This is handled in projectile.update()
                    return;
                }

                // --- MODIFIED: Added damageType logic ---
                const enemiesInRow = enemies.filter(e => !e.isHypnotized && Math.max(0, Math.min(ROWS - 1, Math.round(e.y / TILE_SIZE))) === p.row);
                for (const enemy of enemiesInRow) {
                    // NEW: Check for stealth
                    if (enemy.typeKey === 'STEALTH' && enemy.isStealthed) {
                        continue; // Skip this enemy
                    }
                    
                    // NEW: Check for shield
                    if (enemy.typeKey === 'SHIELD_MOWER' && p.typeKey !== 'PEPPER' && p.typeKey !== 'BULB' && p.typeKey !== 'CARB' && p.typeKey !== 'HEAVY_ZAP_ATTACK') { // Explosives and heavy zaps go through
                         if (rectsOverlap(p, enemy)) {
                            p.hasHit = true; // Projectile is destroyed
                            break; // Stop checking this projectile
                         }
                    }
                
                    if (rectsOverlap(p, enemy)) { 
                        p.hasHit = true; 
                        const projectileData = PROJECTILE_TYPES[p.typeKey];
                        
                        let damageType = 'normal';
                        if (p.typeKey === 'ZAP') damageType = 'zap';
                        // Note: HEAVY_ZAP_ATTACK is homing, so it's handled in projectile.update()
                        
                        if (projectileData.isExplosive) {
                            explosions.push(new Explosion(p.x, p.y + p.height / 2, projectileData.explosionRadius, projectileData.damage, projectileData.explosionColor || 'orange', damageType));
                        } else {
                            enemy.takeDamage(p.damage, damageType); 
                            if (projectileData.pushback) {
                                enemy.x += projectileData.pushback;
                                if (enemy.x > CANVAS_WIDTH - enemy.width) {
                                    enemy.x = CANVAS_WIDTH - enemy.width;
                                }
                            }
                        }
                        break; 
                    }
                }
                // --- END MODIFIED ---
            });
        }

        function cleanupArrays() {
            plants = plants.filter(p => !p.removed && p.health > 0); 
            enemies = enemies.filter(e => e.health > 0);
            projectiles = projectiles.filter(p => !p.hasHit && !p.isOffscreen);
            explosions = explosions.filter(e => e.isAlive);

            expiredLava.forEach(tile => {
                // Remove any existing burnt tile at this spot
                burntTiles = burntTiles.filter(t => t.row !== tile.row || t.col !== tile.col);

        // === DRAWING & UI ===

        function _drawLawnSlow() {

                    } else {
                        drawImageOrFallback(ctx, images.tile, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);

                    if (!lava && isTileWater(r, c)) {
                        ctx.save();
                        const patch = waterPatches.find(p => p.row === r && p.col === c);
                        // Fade out in last 2 seconds
                        if (patch && patch.timer < 2 * FPS) { 
                            ctx.globalAlpha = Math.max(0, patch.timer / (2 * FPS));
                        }
                        drawImageOrFallback(ctx, images.tile_water, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);

        function drawBossHealthBar() {

        // === EVENT HANDLERS & HELPERS ===

            hideContextMenu();
            const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY;
            const col = Math.floor(mouseX / TILE_SIZE); const row = Math.floor(mouseY / TILE_SIZE);
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
            if (isUprooting) {
                const plant = gameGrid[row][col];
                if (plant) { currency += uprootRefund(plant); updateTopBar(); plant.remove(); }
                toggleUproot();
            } else if (selectedPlantType) {
                const plantData = PLANT_TYPES[selectedPlantType];
                if (currency >= plantData.cost && !gameGrid[row][col] && !isTileBurnt(row, col) && !isTileWater(row, col)) { // ADDED water check
                    currency -= plantData.cost; updateTopBar();
                    const newPlant = new Plant(row, col, selectedPlantType);
                    
                    // Apply instant cooldown hack if active
                    if (hacks.instantCooldowns) {
                        applyBoostToPlant(newPlant);

            const mouseX = (e.clientX - rect.left) * scaleX; const mouseY = (e.clientY - rect.top) * scaleY;

    ctx.fillStyle = g; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    // hover ghost
    if (mouse && !isPaused) {
      const c = Math.floor(mouse.x / TILE_SIZE), r = Math.floor(mouse.y / TILE_SIZE);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const occ = gameGrid[r] && gameGrid[r][c];
        let ok = true, img = null;
        if (selectedPlantType) { const d = PLANT_TYPES[selectedPlantType]; ok = currency >= d.cost && !occ && !isTileBurnt(r, c) && !isTileWater(r, c); img = images[d.imageKey]; }
        else if (isUprooting) ok = !!occ;
        if (selectedPlantType || isUprooting) {
          ctx.fillStyle = ok ? 'rgba(120,255,120,.22)' : 'rgba(255,70,70,.25)'; ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = ok ? '#8f8' : '#f66'; ctx.lineWidth = 3; ctx.strokeRect(c * TILE_SIZE + 2, r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
          if (ok && img && selectedPlantType) { ctx.globalAlpha = .5; drawImageOrFallback(ctx, img, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE * .9, TILE_SIZE * .9); ctx.globalAlpha = 1; }
          // lane highlight
          ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(0, r * TILE_SIZE, CANVAS_WIDTH, TILE_SIZE);
        }
      }
    }
  };

  // particles, texts, vignette, restore camera
  const _ov = drawOverlay;
  drawOverlay = function () {
    for (let n = 0; n < _dtSteps; n++) {
      for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= .98; if (--p.life <= 0) parts.splice(i, 1); }
      for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.y -= .7; t.life--; if (t.life <= 0) texts.splice(i, 1); }
    }
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + .6 * p.life / p.max), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '900 20px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#000a';
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      ctx.globalAlpha = Math.min(1, t.life / 20); ctx.strokeText(t.str, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'start';
    ctx.restore(); // camera shake
    ctx.drawImage(vignetteLayer(), 0, 0);
    _ov();
  };

  // ---------- mechanics: hotkeys, auto-pause, affordability, wave banner ----------
  addEventListener('keydown', e => {
    if (!gameRunning) return;
    const k = e.key.toLowerCase();
    if (k === 'p') togglePause(); else if (k === 'u') toggleUproot(); else if (k === 'x') toggleTwoxSpeed();
    else if (k === 'escape') { selectedPlantType = null; if (isUprooting) toggleUproot(); document.querySelectorAll('.plant-card.selected').forEach(c => c.classList.remove('selected')); chip.textContent = 'Pick a seed'; setTray(false); hideContextMenu(); }
    else if (/^[1-9]$/.test(k)) { const c = tray.children[+k - 1]; if (c) c.click(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && gameRunning && !isPaused && !isGameOverAnimation) togglePause(); });
  setInterval(() => { if (!gameRunning) return; document.querySelectorAll('.plant-card').forEach(c => { const d = PLANT_TYPES[c.dataset.type]; if (d) c.classList.toggle('poor', currency < d.cost); }); }, 250);
  window.__shake = v => { shake = Math.max(shake, v); };
  let lastWave = 0;
  setInterval(() => { if (gameRunning && currentWave !== lastWave && currentWave > 0) { lastWave = currentWave; addText(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 'WAVE ' + currentWave, '#ffd34d'); shake = 5; } }, 200);
})();
</script>

<script>
/* ===== ANIMATION + BESTIARY LAYER ===== */
(() => {
  const $ = id => document.getElementById(id);
  // ---------------- own particle layer ----------------
  const P = [], R = [], TX = [];
  const spark = (x, y, n, col, spd, life, size, grav = .1) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (.3 + Math.random()) * spd; P.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, size: size * (.5 + Math.random()), col, grav, star: 0}); } };
  const cone = (x, y, dir, n, col, spd, life, size, grav = .02) => { for (let i = 0; i < n; i++) { const a = (Math.random() - .5) * 1.1, v = (.4 + Math.random()) * spd; P.push({x, y, vx: Math.cos(a) * v * dir, vy: Math.sin(a) * v, life, max: life, size: size * (.5 + Math.random()), col, grav}); } };
  const ring = (x, y, r, col, life = 24) => R.push({x, y, r, col, life, max: life});
  const word = (x, y, str, col) => TX.push({x, y, str, col, life: 50});
  const _ov = drawOverlay;
  drawOverlay = function () {
    if (!isPaused) { for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= .97; if (--p.life <= 0) P.splice(i, 1); } for (let i = R.length - 1; i >= 0; i--) if (--R[i].life <= 0) R.splice(i, 1); for (let i = TX.length - 1; i >= 0; i--) { TX[i].y -= .8; if (--TX[i].life <= 0) TX.splice(i, 1); } }
    ctx.save();
    for (const p of P) { const k = p.life / p.max; ctx.globalAlpha = k; ctx.fillStyle = p.col; ctx.beginPath();
      if (p.star) { const r = p.size * (.5 + k); ctx.globalCompositeOperation = 'lighter'; ctx.moveTo(p.x, p.y - r * 1.6); ctx.lineTo(p.x + r * .4, p.y - r * .4); ctx.lineTo(p.x + r * 1.6, p.y); ctx.lineTo(p.x + r * .4, p.y + r * .4); ctx.lineTo(p.x, p.y + r * 1.6); ctx.lineTo(p.x - r * .4, p.y + r * .4); ctx.lineTo(p.x - r * 1.6, p.y); ctx.lineTo(p.x - r * .4, p.y - r * .4); ctx.closePath(); }
      else ctx.arc(p.x, p.y, p.size * (.4 + .6 * k), 0, 6.283); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
    for (const r of R) { const k = 1 - r.life / r.max; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.col; ctx.lineWidth = 5 * (1 - k) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (.2 + k), 0, 6.283); ctx.stroke(); }
    ctx.font = '900 24px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = '#000b';
    for (const t of TX) { ctx.globalAlpha = Math.min(1, t.life / 18); ctx.strokeText(t.str, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.str, t.x, t.y); }
    ctx.restore(); _ov();
  };

  // ---------------- plant animation (spring recoil / squish / jump) ----------------
  const kick = (pl, o) => { pl.rc = Object.assign({t: 0}, o); };
  const base = Plant.prototype.draw;
  Plant.prototype.draw = function () {
    const r = this.rc;
    if (!r) return base.call(this);
    if (!isPaused) r.t++;
    const k = Math.min(1, r.t / r.len);
    if (r.t >= r.len) this.rc = null;
    const mx = this.x + this.width / 2, by = this.y + this.height;
    let dx = 0, dy = 0, sx = 1, sy = 1, rot = 0, glow = 0;
    const env = Math.exp(-k * 4.2);
    if (r.kind === 'kick') {            // recoil: slides back, squashes along barrel, overshoots, settles
      const w = Math.cos(k * r.freq * 6.283) * env * r.amp;
      dx = -r.dir * w * 13; sx = 1 - w * .15; sy = 1 + w * .11; rot = -r.dir * w * .05;
    } else if (r.kind === 'squish') {   // two-way shooter: squeezed from both sides, bulges up, springs back
      const w = Math.cos(k * r.freq * 6.283) * env * r.amp;
      sx = 1 - w * .26; sy = 1 + w * .2; dy = -Math.max(0, w) * 4;
    } else if (r.kind === 'zap') {      // crackling jitter
      const j = env * r.amp; dx = (Math.random() - .5) * 7 * j; dy = (Math.random() - .5) * 5 * j; sx = 1 + j * .08; sy = 1 - j * .06; glow = j;
    } else if (r.kind === 'beam') {     // charged vibrate, sustained
      const j = Math.sin(k * Math.PI) * r.amp; dx = Math.sin(r.t * 2.2) * 2.5 * j; sy = 1 + Math.sin(r.t * .9) * .04 * j; sx = 1 - Math.sin(r.t * .9) * .03 * j; glow = j * .6;
    } else if (r.kind === 'pop') {      // producer: anticipate, jump, land, wobble
      if (k < .22) { const q = k / .22; sx = 1 + .15 * q * r.amp; sy = 1 - .17 * q * r.amp; }
      else if (k < .55) { const q = (k - .22) / .33, h = 4 * q * (1 - q); dy = -h * 20 * r.amp; sx = 1 + .15 * (1 - q) * r.amp - .1 * h; sy = 1 - .17 * (1 - q) * r.amp + .2 * h; }
      else { const q = (k - .55) / .45, d = Math.exp(-q * 4) * Math.cos(q * 10); sx = 1 + .12 * d * r.amp; sy = 1 - .14 * d * r.amp; }
      glow = k < .7 ? Math.sin(k / .7 * Math.PI) : 0;
    }
    if (glow > 0.02) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(.8, glow * .7);
      const g = ctx.createRadialGradient(mx, by - this.height / 2, 4, mx, by - this.height / 2, TILE_SIZE * .8);
      g.addColorStop(0, r.col || '#ffd34d'); g.addColorStop(1, 'transparent'); ctx.fillStyle = g;
      ctx.fillRect(mx - TILE_SIZE, by - this.height / 2 - TILE_SIZE, TILE_SIZE * 2, TILE_SIZE * 2); ctx.restore();
    }
    ctx.save(); ctx.translate(mx + dx, by + dy); ctx.rotate(rot); ctx.scale(sx, sy); ctx.translate(-mx, -by);
    base.call(this); ctx.restore();
  };

  // per-type recoil tuning: amp (intensity), freq (wobble count), flash colour, smoke
  const REC = {
    BULB_BOPPER:        {amp: .5,  freq: 1.5, col: '#d6ff7a', n: 4},
    DOUBLE_BULB_BOPPER: {amp: .7,  freq: 2.5, col: '#d6ff7a', n: 6},
    TRIPLE_BULB_BOPPER: {amp: .85, freq: 3.5, col: '#d6ff7a', n: 8},
    BACK_BULB_BOPPER:   {amp: .55, freq: 1.5, col: '#d6ff7a', n: 4},
    FLIP_BULB_BOPPER:   {amp: .9,  freq: 2,   col: '#d6ff7a', n: 5, squish: 1},
    BEEFY_BEETROOT:     {amp: 1.0, freq: 1.2, col: '#ff6fa8', n: 7, smoke: 1},
    CARB_CANNON:        {amp: 1.45, freq: 1.2, col: '#ffd9a0', n: 12, smoke: 1, shake: 3},
    PEPPER_POPPER:      {amp: 1.1, freq: 1.6, col: '#ff7a1a', n: 10, smoke: 1, shake: 2},
    ZUCCHINI_ZAPPER:    {amp: .9,  freq: 1,   col: '#7ff', n: 8, zap: 1},
  };
  const _shoot = Plant.prototype.shoot;
  Plant.prototype.shoot = function (t) {
    _shoot.call(this, t);
    const c = REC[this.typeKey]; if (!c) return;
    const back = this.typeKey === 'BACK_BULB_BOPPER', dir = back ? -1 : 1, my = this.y + this.height / 2 - 10;
    if (c.zap) kick(this, {kind: 'zap', len: 16, amp: c.amp, col: '#7ff'});
    else if (c.squish) kick(this, {kind: 'squish', len: 26, amp: c.amp, freq: c.freq});
    else kick(this, {kind: 'kick', len: 28 + c.amp * 8, amp: c.amp, freq: c.freq, dir});
    const bx = c.squish ? this.x + this.width / 2 : (dir > 0 ? this.x + this.width - 8 : this.x + 8);
    cone(bx, my, dir, c.n, c.col, 2 + c.amp * 2, 14 + c.amp * 6, 3 + c.amp * 2, 0);
    if (c.squish) cone(this.x + 8, my, -1, c.n, c.col, 3, 16, 4, 0);
    if (c.smoke) cone(bx, my, dir, 4 + c.n / 2, '#bbb', 1.2, 36, 6 + c.amp * 3, -.01);
    if (c.shake && window.__shake) window.__shake(c.shake);
  };
  // beams & heavy zaps (not fired through shoot())
  const nearest = (type, row, x) => plants.filter(p => p.behavior === type && p.row === row).sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x))[0];
  const bd = Beam.prototype.draw;
  Beam.prototype.draw = function () {
    if (!this._fx) { this._fx = 1; const p = nearest('BEAM', this.row, this.x); if (p && p.x < this.x + 20) { kick(p, {kind: 'beam', len: Math.max(20, (this.duration || 18)), amp: 1, col: '#e6a0ff'}); spark(this.x, this.y, 8, '#e6a0ff', 3, 20, 3, 0); ring(this.x, this.y, 36, '#e6a0ff'); } }
    bd.call(this);
  };
  const pd = Projectile.prototype.draw;
  Projectile.prototype.draw = function () {
    if (!isGameOverAnimation && !this._fx2) { this._fx2 = 1;
      if (this.typeKey === 'HEAVY_ZAP_ATTACK') { const p = nearest('HEAVY_ZAPPER', this.row, this.x); if (p && Math.abs(p.x + p.width / 2 - this.x) < 60) { kick(p, {kind: 'kick', len: 44, amp: 1.8, freq: 1.4, dir: 1}); ring(this.x, this.y, 50, '#ffa040', 28); spark(this.x, this.y, 14, '#ffb050', 5, 24, 4, .05); window.__shake && window.__shake(6); } } }
    pd.call(this);
  };

  // ---------------- producer coins ----------------
  const fiU = FloatingIcon.prototype.update, fiD = FloatingIcon.prototype.draw;
  FloatingIcon.prototype.update = function () {
    if (this._t === undefined) {
      this._t = 0; this.trail = []; this.rot = Math.random() * 6;
      if (this.type === 'currency') {
        const pl = plants.find(p => p.behavior === 'PRODUCER' && Math.abs(p.x - this.x) < 2 && Math.abs(p.y - this.y) < 2);
        const big = pl && pl.typeKey === 'FORTUNION';
        if (pl) { kick(pl, {kind: 'pop', len: big ? 46 : 38, amp: big ? 1.25 : .85, col: big ? '#fff08a' : '#ffd34d'});
          const cx = pl.x + pl.width / 2, cy = pl.y + pl.height / 2, amt = PLANT_TYPES[pl.typeKey].productionAmount || 1;
          ring(cx, cy, 46 + (big ? 22 : 0), '#ffd34d'); spark(cx, cy - 10, big ? 16 : 8, '#ffe680', 3.2, 30, 3, .06);
          for (let i = 0; i < (big ? 6 : 3); i++) P.push({x: cx + (Math.random() - .5) * 50, y: cy + (Math.random() - .5) * 40, vx: 0, vy: -.6, life: 26 + i * 4, max: 30 + i * 4, size: 4, col: '#fff3a0', grav: 0, star: 1});
          word(cx, pl.y - 6, '+$' + amt, big ? '#fff08a' : '#ffd34d'); }
        this.x += TILE_SIZE * .35; this.y += TILE_SIZE * .2; this.vx = (Math.random() - .5) * 4.5; this.vy = -8 - Math.random() * 2; this.floor = this.y + TILE_SIZE * .25;
      } else { this.vx = (Math.random() - .5) * 3; this.vy = -6; this.floor = this.y + 14; }
    }
    if (this._t < 26) {                       // pop out, bounce once on the lawn
      this.x += this.vx; this.y += this.vy; this.vy += .6; this.rot += .35;
      if (this.y > this.floor && this.vy > 0) { this.y = this.floor; this.vy *= -.45; this.vx *= .6; if (this.type === 'currency') spark(this.x, this.y + 10, 3, '#ffe680', 1.5, 14, 2.5, .08); }
      this._t++; return;
    }
    this.trail.push({x: this.x, y: this.y}); if (this.trail.length > 10) this.trail.shift();
    this.rot += .3; fiU.call(this);
    if (!this.isAlive) { const el = this.targetElement && this.targetElement.parentElement; if (el) { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); } }
  };
  setInterval(() => { if (!gameRunning && fxCanvas) fxCtxRef.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }, 400);
  FloatingIcon.prototype.draw = function () {
    if (this._t === undefined) return;
    const fx = getFxCtx(), rr = canvasRect(), kk = rr.width / CANVAS_WIDTH; let nonCur = false;
    const fadeAlpha = this.alpha === undefined ? 1 : this.alpha;
    fx.save(); fx.translate(rr.left, rr.top); fx.scale(kk, kk);
    for (let i = 0; i < this.trail.length; i++) { const t = this.trail[i], a = (i + 1) / this.trail.length; fx.globalAlpha = fadeAlpha * a * .45; fx.fillStyle = this.type === 'currency' ? '#ffd34d' : '#9ff'; fx.beginPath(); fx.arc(t.x + 8, t.y - 8, 2 + a * 5, 0, 6.283); fx.fill(); }
    fx.globalAlpha = fadeAlpha;
    if (this.type === 'currency') {
      const w = Math.max(.18, Math.abs(Math.cos(this.rot))), cx = this.x + 8, cy = this.y - 8;
      fx.fillStyle = 'rgba(0,0,0,.25)'; if (this._t < 26) { fx.beginPath(); fx.ellipse(cx, this.floor + 10, 10 * w, 4, 0, 0, 6.283); fx.fill(); }
      fx.translate(cx, cy); fx.scale(w, 1);
      const g = fx.createRadialGradient(-4, -4, 1, 0, 0, 14); g.addColorStop(0, '#fff7b0'); g.addColorStop(.6, '#ffd02a'); g.addColorStop(1, '#c58a00');
      fx.fillStyle = g; fx.strokeStyle = '#8a5d00'; fx.lineWidth = 2.5; fx.beginPath(); fx.arc(0, 0, 14, 0, 6.283); fx.fill(); fx.stroke();
      fx.fillStyle = '#8a5d00'; fx.font = '900 17px system-ui'; fx.textAlign = 'center'; fx.textBaseline = 'middle'; fx.fillText('$', 0, 1);
      fx.globalCompositeOperation = 'lighter'; fx.globalAlpha = fadeAlpha * (.35 + .25 * Math.sin(this.rot * 2)); fx.fillStyle = '#ffe680'; fx.beginPath(); fx.arc(0, 0, 20, 0, 6.283); fx.fill();
    } else { nonCur = true; }
    fx.restore();
    if (nonCur) fiD.call(this);
  };

  // ---------------- IndexedDB discovery store ----------------
  const seen = new Set(); let db = null;
  const open = () => new Promise(res => { try { const q = indexedDB.open('plm-bestiary', 1); q.onupgradeneeded = () => q.result.createObjectStore('seen'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); } catch (e) { res(null); } });
  const idbAll = () => new Promise(res => { if (!db) return res([]); try { const r = db.transaction('seen').objectStore('seen').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => res([]); } catch (e) { res([]); } });
  const idbPut = k => { if (!db) return; try { db.transaction('seen', 'readwrite').objectStore('seen').put(Date.now(), k); } catch (e) {} };
  const idbClear = () => { if (!db) return; try { db.transaction('seen', 'readwrite').objectStore('seen').clear(); } catch (e) {} };
  const ready = open().then(d => { db = d; return idbAll(); }).then(keys => { keys.forEach(k => seen.add(k)); });

  const toast = $('seen-toast'); let toastT;
  const markSeen = key => {
    if (seen.has(key)) return; seen.add(key); idbPut(key);
    const t = ENEMY_TYPES[key]; if (!t) return;
    toast.innerHTML = `<img src="${IMAGE_SOURCES[t.imageKey]}" alt=""><div><div style="font-size:.7em;color:#7ff">NEW BESTIARY ENTRY</div>${t.name}</div>`;
    toast.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('on'), 3200);
  };
  const ed = Enemy.prototype.draw;
  Enemy.prototype.draw = function () { if (!seen.has(this.typeKey) && this.x < CANVAS_WIDTH - 10 && !this.isHypnotized) markSeen(this.typeKey); ed.call(this); };

  // ---------------- Bestiary UI ----------------
  const LORE = {
    START:['Intern','The mower every lawn crew trains on. Wobbly, underpowered and just here to learn.','Chews through plants fast for its size.','Anything kills it. Plant cheap and don\'t waste good seeds on it.'],
    CLASSIC:['Standard','The backbone of the mower army. Reliable, plodding, endlessly replaceable.','No tricks: it walks forward and bites whatever stands in its way.','A couple of Bulb Boppers per lane keeps these at bay.'],
    SPEEDY:['Sprinter','Tuned for races, not for gardening. It hits the front line before you finish placing seeds.','Moves much faster than regular mowers.','Keep a shooter in every lane so it never gets a free bite.'],
    STONE:['Armored','Carved from a single boulder. Takes a lot of punishment but never hurries.','Very high health, slow pace.','Stack firepower or use thorny plants to wear it down while walls stall it.'],
    TANK:['Crusher','A tracked behemoth that flattens even plants that normally can\'t be touched.','Hits for 1000 damage every 2 seconds and can crush ground-level plants like spikes.','Kill it before it arrives. Walls only buy a moment.'],
    FIRE_MOWER:['Arsonist','Leaves scorched earth wherever its engine overheats.','Burns the lawn tile when it destroys a plant, so you can\'t replant there for a while.','Defend the tile: keep it from finishing off a plant.'],
    UNPREDICTABLE:['Wild Card','Its steering is broken, and so is its sense of direction.','Randomly swerves to other lanes every few seconds.','Cover all lanes. Plants that hit multiple rows are ideal.'],
    PUSH_MOWER:['Bulldozer','Doesn\'t bite: it shoves. Your plants get pushed back down the lawn instead.','Pushes plants away rather than damaging them.','Keep walls away from your producers and shooters and keep killing it from range.'],
    REAPER_MOWER:['Harvester','A grim blade that finishes plants off with extra cruelty.','Reaps plants with a special harvest attack.','Don\'t let it reach valuable plants. Intercept with shooters.'],
    BACK_MOWER:['Flanker','Races past your defenses, then turns around to attack from behind.','Sprints across the lawn then returns slowly the other way.','Back Bulb Boppers and Flip Boppers were made for this one.'],
    SKULLCRUSHER:['Heavy Crusher','A Tank\'s meaner cousin. Heavier plating, faster fists and a habit of changing lanes.','1500 damage per hit and it swerves between lanes.','Bring serious firepower. Heavy Zappers or beams shine here.'],
    DESTROYER_TANK:['BOSS','The final machine. When it rolls out, the whole lawn shakes.','Summons waves of mowers, scorches an entire lane with lava, and crushes anything it touches.','Save your best plants and boosts. Break its escorts first.'],
    STEALTH:['Ghost','Hides in shadow until it is almost on top of you.','Invisible to shooters while stealthed, only attackable when exposed.','Use plants that don\'t need to see it, such as spikes, and hold walls.'],
    SHIELD_MOWER:['Shielded','Carries a heavy shield that deflects most things you throw at it.','Blocks most normal shots and resists zaps. Explosives and heavy attacks get through.','Use Pepper Poppers, Bulb explosions or heavy zaps to crack it.'],
    KAMIKAZE:['Bomber','Fragile, fast and absolutely willing to go out with a bang.','Detonates for 1500 damage on contact with a plant.','Shoot it long before it reaches the front line.'],
    SPLITTER:['Splitter','Breaks into smaller mowers when it dies, so one kill is never enough.','Splits into Mini-Mowers once it has taken enough damage.','Keep damage output high enough to handle the swarm that follows.'],
    MINI_MOWER:['Swarm','A pocket-sized mower. Annoying in groups, harmless alone.','Quick and fragile.','Splash damage clears them in one go.'],
    THIEF:['Thief','Doesn\'t fight. It steals a plant, then runs away with it.','Grabs a plant off the lawn and escapes. If it gets away you lose the plant.','Kill it before it touches anything. Shoot it as soon as it appears.'],
    RAGE:['Berserker','Starts calm, then gets furious when hurt.','Becomes faster and hits harder when damaged.','Burst it down quickly instead of whittling it away.'],
    GENERAL:['Commander','Never attacks directly. It barks orders and the other mowers listen.','Boosts nearby mowers with new abilities on a cooldown.','Kill it first whenever you can. Everything else gets worse while it lives.'],
    TIGER:['Pack Hunter','Strong alone, deadly in packs.','Gets stronger for each other Tiger Mower on the lawn.','Take them out one at a time and don\'t let a pack build up.'],
    TRUE_SPEEDY:['Rocket','What happens when a Speed Mower gets a second engine.','Blisteringly fast and hits hard.','Hold a strong wall in every lane and focus fire.'],
  };
  const spd = v => v >= 2.1 ? 'Lightning' : v >= 1.5 ? 'Blazing' : v >= .8 ? 'Fast' : v >= .45 ? 'Brisk' : v >= .28 ? 'Steady' : 'Crawling';
  const grid = $('bestiary-grid');
  const render = () => {
    const keys = []; WAVE_DATA.forEach(w => Object.keys(w.mowerTypes).forEach(k => { if (ENEMY_TYPES[k] && !keys.includes(k)) keys.push(k); }));
    Object.keys(ENEMY_TYPES).forEach(k => { if (!keys.includes(k)) { const si = keys.indexOf('SPLITTER'); if (k === 'MINI_MOWER' && si >= 0) keys.splice(si + 1, 0, k); else keys.push(k); } });
    let n = 0;
    grid.innerHTML = keys.map((k, i) => {
      const t = ENEMY_TYPES[k], L = LORE[k] || ['Mower', '', '', ''], have = seen.has(k); if (have) n++;
      const img = `<img src="${IMAGE_SOURCES[t.imageKey]}" alt="" onerror="this.style.visibility='hidden'">`;
      if (!have) return `<div class="bz locked" style="animation-delay:${i * 25}ms"><div class="top">${img}<div><div class="tag">UNDISCOVERED</div><h3>???</h3></div></div><p>Survive the waves to find out what this one does.</p></div>`;
      return `<div class="bz" style="animation-delay:${i * 25}ms"><div class="top">${img}<div><div class="tag">${L[0].toUpperCase()}</div><h3>${t.name}</h3></div></div>
        <div class="stats"><span>HP ${t.health}</span><span>Speed: ${spd(t.speed)}</span><span>Bounty $${t.moneyOnDrop || 0}</span>${t.attackDamage >= 100 ? `<span>Hit ${t.attackDamage}</span>` : ''}</div>
        <p>${L[1]}</p><p><b>Ability:</b> ${L[2]}</p><p><b>Tip:</b> ${L[3]}</p></div>`;
    }).join('');
    $('bestiary-count').textContent = `Discovered ${n} / ${keys.length}`;
    $('bestiary-bar').firstElementChild.style.width = (n / keys.length * 100) + '%';
  };
  const ov = $('bestiary-overlay');
  const show = async o => { if (o) { await ready; render(); } ov.classList.toggle('on', o); };
  $('bestiary-button').onclick = () => show(true);
  $('bestiary-close').onclick = () => show(false);
  ov.addEventListener('click', e => { if (e.target === ov) show(false); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && ov.classList.contains('on')) show(false); });
  $('bestiary-reset').onclick = () => { if (confirm('Forget every mower you have discovered?')) { seen.clear(); idbClear(); render(); } };
})();
</script>
</body>
</html>
